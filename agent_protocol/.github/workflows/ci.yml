name: CI
# agent_protocol's CI, as Reviews' policy for Logan's repositories has it
# (AttilaTheFun/reviews, docs/CI_POLICY.md): automated CI only builds.
#
# - A pull request, and each commit on main, runs `container`, the required
#   check: in one of Shireworks' single-use Linux containers, it checks the
#   protos' Swift matches the protos, and builds the package and its tests.
#   A fork's pull request runs nothing here.
# - `verify`, by hand (workflow_dispatch): the tests.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.head_ref)
        || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  container:
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, agent_protocol-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: |
          version=36.2
          case "$(uname -m)" in aarch64|arm64) arch=aarch_64 ;; *) arch=x86_64 ;; esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-linux-$arch.zip"
          mkdir -p "$RUNNER_TEMP/protoc" && python3 -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$RUNNER_TEMP/protoc.zip" "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
      - name: The protos' Swift matches the protos
        run: PROTOC="$RUNNER_TEMP/protoc/bin/protoc" tools/generate.sh --check
      - name: The package and its tests
        run: swift build --build-tests

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, agent_protocol-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: swift test
