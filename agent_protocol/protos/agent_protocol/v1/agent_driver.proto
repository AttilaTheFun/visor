// Where an agent is watched and steered: the wrapper dials the driver
// (AGENT_DRIVER_URL, out through MultiPass) and keeps one stream open. Up
// go its conversation and what it is doing; down come messages, answers to
// its permission asks, a model to change to, an interrupt. Claude's `-p`,
// across harnesses, over gRPC, and outbound from the agent rather than
// inbound to it. Implemented by Visor's server, which keeps what it is told
// (a SQLite cache, the state in memory) for clients that come later, and
// sends pushes.
syntax = "proto3";

package agent_protocol.v1;

import "agent_protocol/v1/common.proto";

service AgentDriver {
  rpc Connect(stream WrapperMessage) returns (stream DriverMessage);
  // A resumed session's conversation, before its harness starts: its files
  // (the conversation, its subagents, the project's memory), each with
  // where it goes under the harness's own folder for the folder it will
  // work in. Empty for an agent the driver has no conversation of.
  rpc Conversation(ConversationRequest) returns (stream ConversationFile);
}

message ConversationRequest {
  AgentID agent = 1;
  // Where the resumed session will work, as the wrapper's machine has it:
  // the harness keys its conversations by this folder.
  string working_directory = 2;
  // The harness ("claude"), whose folder the places are under.
  string harness = 3;
}

// A file of the conversation, or a piece of one: `place` is its path
// under the harness's folder (Claude's ~/.claude, or $CLAUDE_CONFIG_DIR),
// already for the request's working directory. A file larger than a
// piece comes as several, in order, with the same place; `last` marks a
// file's last piece.
message ConversationFile {
  string place = 1;
  bytes data = 2;
  bool last = 3;
}

// The wrapper's first message on the stream, and again after a reconnect.
message WrapperHello {
  int32 protocol = 1;
  AgentID agent = 2;
  AgentSpec spec = 3;
  // The harness's session id, once known.
  string session_id = 4;
  // The machine it runs on, as people see it.
  string host_name = 5;
  // The id of the last entry the driver acknowledged before a reconnect;
  // empty to send the conversation from its start.
  string resume_after_entry = 6;
}

message WrapperMessage {
  oneof message {
    WrapperHello hello = 1;
    // New or changed rows, in order.
    Entries entries = 2;
    EphemeralState state = 3;
    ApprovalRequest approval = 4;
    // The agent ended: why.
    string ended = 5;
    // The harness's session id, when it changes (a fork, a resume).
    string session_id = 6;
  }
}

message Entries {
  repeated TranscriptEntry entries = 1;
}

message DriverMessage {
  oneof message {
    // Words for the agent, as a turn (queued if it is busy).
    Send send = 1;
    Approval approval = 2;
    ModelChange model = 3;
    // Stop the turn under way.
    Empty interrupt = 4;
    // End the agent.
    Empty stop = 5;
    // The entries received, up to this id.
    string acknowledged = 6;
  }
}

message Send {
  // The message's id, so a resend is taken once.
  string id = 1;
  string text = 2;
  // Attachments, as paths where the agent runs.
  repeated string files = 3;
}

message Approval {
  string request_id = 1;
  bool allow = 2;
  string reason = 3;
}

message ModelChange {
  string model = 1;
  string effort = 2;
}

message Empty {}
