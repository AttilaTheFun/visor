// The wrapper itself, for the runner that started it (over a Unix socket
// beside it, or loopback): what it is doing, and what the runner tells it.
// The wrapper normalizes Claude, Codex and the other harnesses into one
// shape, and keeps what isn't in their logs (thinking, subagents, tool
// calls under way) and the queue.
syntax = "proto3";

package agent_protocol.v1;

import "agent_protocol/v1/common.proto";

service AgentWrapper {
  // What it is and is doing now.
  rpc Status(StatusRequest) returns (WrapperStatus);
  // What it says, from now on: entries and state as they change.
  rpc Watch(WatchRequest) returns (stream WrapperEvent);
  // Words for the agent (a resumed job's prompt, say).
  rpc Send(SendRequest) returns (SendResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  // End the agent, within `grace_seconds`, then the wrapper.
  rpc Stop(StopRequest) returns (StopResponse);
}

message StatusRequest {}

message WrapperStatus {
  AgentID agent = 1;
  AgentSpec spec = 2;
  string session_id = 3;
  EphemeralState state = 4;
  // Whether it is connected to its driver (when it has one).
  bool driver_connected = 5;
  // Set once the agent has ended: why.
  string ended = 6;
}

message WatchRequest {}

message WrapperEvent {
  oneof event {
    TranscriptEntry entry = 1;
    EphemeralState state = 2;
    ApprovalRequest approval = 3;
    string ended = 4;
  }
}

message SendRequest {
  string id = 1;
  string text = 2;
}

message SendResponse {
  // Taken now, or queued for the turn's end.
  bool queued = 1;
}

message InterruptRequest {}
message InterruptResponse {}

message StopRequest {
  int32 grace_seconds = 1;
}

message StopResponse {}
