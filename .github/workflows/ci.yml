name: CI
# Every commit pushed to a pull request, and main's: the tests, the iPhone
# simulator's screens and UI tests in each orientation and the Mac's screens
# (kept as this run's artifacts), every platform's build; then, on the
# release Mac's runner (self-hosted, release-mac), the pull request's
# packages built, signed and published to Releases, and its runs read into
# Reviews. A newer push to the pull request cancels this run if it hasn't
# finished. main requires every job green on a pull request's head commit
# before it merges. A fork's pull request never runs on the release Mac.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # main's runs are never cut short: a release's dossier reads its tag's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  test:
    # Xcode 27, the toolchain the code is written against.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Every target compiles in the Swift 6 mode with warnings as errors
      # (tools/swift), so building is a check of its own: the libraries,
      # the staging server and the apps' own code for the Mac, then the
      # views and the phone app's code for iOS. The app bundles themselves
      # need a signing team and are not built here.
      - name: Build (macOS)
        run: >
          bazel build
          //libraries/...
          //tools/staging_server
          //applications/visor_macos:macos_lib
          //applications/visor_menubar:menubar_lib
      - name: Build (iOS)
        run: >
          bazel build --platforms=@apple_support//platforms:ios_sim_arm64
          //libraries/visor_ui
          //applications/visor_ios:ios_lib
          //applications/visor_ios:widget_lib
      - name: Test
        run: >
          bazel test --test_output=errors
          //tests/visor_server_tests
          //tests/visor_client_tests
          //tests/visor_ui_tests
          //tests/visor_ssh_tests
          //tests/message_cache_tests
          //tests/claude_transcript_tests

  # The phone app itself, in the simulator: the probe's cases that need no
  # computer, on the snapshot fixture. The thread must not move when it
  # learns there are rows before it (the jump on the first send after a
  # launch, 0.26). A simulator build needs no signing team.
  # The iPhone app on the simulator, in each orientation: the snapshot
  # fixture's screens, then the UI test cases, each recorded with its
  # pictures. What they make is kept as this run's artifacts (ios-portrait,
  # ios-landscape), which a release's dossier is read from
  # (releases: pipeline-ci test). The same runs on a VM, or any Mac with
  # Xcode: tools/ios_ui_tests.sh.
  ios-ui:
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit itself (a pull request's head), as it is reviewed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Simulator
        run: |
          runtime="$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-27-0' | head -1)"
          id="$(xcrun simctl list devices | grep -F "BAZEL_TEST_iPhone 17_27.0 (" | grep -o '[0-9A-F-]\{36\}' | head -1)"
          [ -n "$id" ] || id="$(xcrun simctl create "BAZEL_TEST_iPhone 17_27.0" "iPhone 17" "$runtime")"
          xcrun simctl boot "$id" 2>/dev/null || true
          xcrun simctl bootstatus "$id"
          xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: The fixture's screens
        env:
          VISOR_UI_CASES: VisorProbe/${{ matrix.orientation == 'landscape' && 'testFixtureScreensLandscape' || 'testFixtureScreens' }}
        run: tools/ios_ui_tests.sh
      - name: UI tests, recorded
        env:
          VISOR_PROBE_ORIENTATION: ${{ matrix.orientation }}
        run: |
          set -o pipefail
          tools/ios_ui_tests.sh | tee ui-tests.log
      - name: Keep
        if: always()
        run: |
          mkdir -p kept/screens
          cp /private/tmp/visor_probe/fixture-*.png kept/screens/ 2>/dev/null || true
          cp -R bazel-testlogs/tests/ios_probe/visor_probe/test.outputs/tests.xcresult kept/ 2>/dev/null || true
          cp ui-tests.log kept/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.orientation }}
          path: kept

  # The Mac client's screens on the screenshot fixture (mac-screenshots), for
  # a release's dossier too.
  mac-screens:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit itself (a pull request's head), as it is reviewed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build
        run: bazel build //tools/mac_screenshots
      - name: Pictures
        timeout-minutes: 10
        run: |
          mkdir -p shots
          tool="$(bazel cquery --output=files //tools/mac_screenshots 2>/dev/null | head -1)"
          for screen in chat question models inspector new-session; do
            "$tool" "$screen" "$PWD/shots/mac-$screen.png" dark
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: shots/*.png

  xcode26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build (macOS)
        run: >
          bazel build
          //libraries/...
          //tools/staging_server
          //applications/visor_macos:macos_lib
          //applications/visor_menubar:menubar_lib
      - name: Build (iOS)
        run: >
          bazel build --platforms=@apple_support//platforms:ios_sim_arm64
          //libraries/visor_ui
          //applications/visor_ios:ios_lib
          //applications/visor_ios:widget_lib
      - name: Test
        run: >
          bazel test --test_output=errors
          //tests/visor_server_tests
          //tests/visor_client_tests
          //tests/visor_ui_tests
          //tests/visor_ssh_tests
          //tests/message_cache_tests
          //tests/claude_transcript_tests

  # The command-line server on Linux: built, its tests run, and the server
  # itself tried — run, a throwaway session over its WebSocket, restarted,
  # stopped (tools/probes/command_line_server.sh). No agent CLI needed.
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: apt-get update && apt-get install -y --no-install-recommends procps curl netcat-openbsd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: swift build --product visor-server
      - name: Test
        run: swift test
      - name: Try the server
        run: tools/probes/command_line_server.sh

  # The command-line server on Windows: built, and tried — run, a throwaway
  # session over its WebSocket, stopped through its REST side.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.4.0-release
          tag: 6.4.0-RELEASE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: swift build --product visor-server
      - name: Try the server
        shell: pwsh
        run: |
          $server = ".build\debug\visor-server.exe"
          $password = & $server password
          Start-Process -FilePath $server -ArgumentList "run","--port","7633" -NoNewWindow `
            -RedirectStandardOutput server.log -RedirectStandardError server-errors.log
          Start-Sleep 3
          $env:VISOR_PORT = "7633"; $env:VISOR_TOKEN = $password; $env:QUIT = "1"
          node tools/probes/server.mjs
          $status = $LASTEXITCODE
          Get-Content server.log, server-errors.log
          exit $status

  # The pull request's packages (the iPhone's .ipa, the Mac's apps signed
  # and notarized), published to Releases as its builds, or the version's
  # on a pre-release branch (release-*). What is done with them is the
  # runner's ($PIPELINE_CI).
  build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: $PIPELINE_CI prepare
      - run: tools/build_packages.sh
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}

  # This run's screens and UI tests (the ios-ui and mac-screens jobs'
  # artifacts) read into Reviews as the pull request's runs, or the
  # version's dossier on a pre-release branch; failed ones too, so they
  # can be seen there.
  review:
    needs: [ios-ui, mac-screens]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/review
      - run: $PIPELINE_CI test Visor
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_ARTIFACTS: ${{ runner.temp }}/review
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}
