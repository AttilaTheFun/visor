name: CI
# Visor's CI, as Reviews' policy for Logan's protected repositories has it
# (AttilaTheFun/reviews, docs/CI_POLICY.md; Logan, 7 Nov 2026):
#
# Automated CI only builds: no test runs on its own (Logan, 7 Nov 2026).
#
# - A pull request runs one job, `container`, the required check: in one of
#   Shireworks' single-use Linux containers (visor-jit, a runner of Visor's
#   agent image), leasing nothing, it checks the rules, builds every app,
#   the Mac's test bundles, libraries and servers on Linux, and builds the
#   command-line server with SwiftPM. Its Bazel reads Shireworks' cache and
#   never writes it. A pull request of documentation alone checks the rules
#   and stops there. A newer push cancels its run. A fork's pull request
#   runs nothing here: no self-hosted runner ever runs a fork's code.
# - Each commit on main runs `populate`: the merged tree built as
#   `container` builds it, cache-only (nothing run, nothing published), the
#   one job that writes the cache.
# - Every test runs only by hand (workflow_dispatch on main, `run`):
#   - `verify`: the Mac's tests (their bundles built on Linux, run on
#     GitHub's own xcode-27 Macs), the command-line server's tests on Linux
#     (linux), blue Visor's web client (blue-web), and the proof: the
#     iPhone's, Visor.app's and blue Visor on Android's screens, on GitHub's
#     own runners. Its last job, `verify`, keeps them as the `proof`
#     artifact (proof.zip, AttilaTheFun/reviews' format 2, which Reviews
#     compares with the prior release's), and its success is the commit's
#     tests passing. Run on a
#     branch pushed at an earlier commit, it bisects a regression;
#   - `prerelease`: no tests or proof. The commit's version is asked of
#     Applications Server, its apps built and published as Alphas, and a
#     draft release marked pre-release proposed (alpha), then the agent
#     image of that version published if tools/containers/ changed since
#     the release before (agent-image);
#   - `release`: verify first, and the pins; only once they pass, alpha and
#     agent-image as above, the draft not marked pre-release, naming the run
#     that verified it;
#   - `adhoc`, on a branch other than main: its AdHoc build, as before;
#   - `agent-image`: Visor's toolchain image alone, built and pushed.
# - Logan's Release in Reviews publishes a proposed release's draft, which
#   makes its tag: `release` checks the commit is on main and was verified,
#   then has Applications Server promote its Alphas to Production;
#   release-assets attaches the Production builds (the Mac's disk image
#   among them) and the proof to the release.
#
# The policy's verify leases a Mac; Visor's runs on GitHub's own runners
# instead, free for a public repository, leaving Shireworks' Mac slots to
# the agents (Logan, 5 Nov 2026). The command-line server on Windows and
# blue Visor on the iPhone stay off until the Mac Studio (Logan, 5 Nov
# 2026: "scope visor down to just ios, macos and android"): their jobs
# are verify's, skipped (`if: false`), their scripts run by hand.
#
# Runners, by label: visor-jit (12 GB) for a build (the agent image's too,
# with buildah), visor-jit-small (2 GB) for a job that only runs a script;
# GitHub's own for the headful proofs alone (the
# iPhone's, the Mac's, the emulator's), and until they are Isomer tests,
# the Mac's XCTest bundles (test). Every other job runs in a container
# (Logan, 8 Nov 2026), verify too: it makes the proof, and Reviews compares
# it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: "verify: the tests and the proof. prerelease: Alphas and a draft pre-release. release: verify, then Alphas and a draft release. adhoc: a branch's AdHoc build. agent-image: Visor's toolchain image, built and pushed."
        type: choice
        options: [verify, prerelease, release, adhoc, agent-image]
        default: verify
  # Logan's Release in Reviews publishes the draft, which makes its v* tag.
  release:
    types: [published]
concurrency:
  # A pull request's newer push cancels its older run. Every other run (main's
  # populate, a run by hand, a release) is a group of its own and never
  # cancelled, so a publish is never cut off halfway.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.head_ref)
        || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
# Every step in bash with pipefail (GitHub's `bash --noprofile --norc -eo
# pipefail {0}`): its default, `bash -e {0}`, takes a pipe's last status, so
# a failing command piped into tee or grep would pass.
defaults:
  run:
    shell: bash
jobs:
  # ---- Pull requests -------------------------------------------------------

  container:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Whether it changes anything but documentation (docs/, .notes/,
      # Markdown).
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # The rules of AGENTS.md that must hold (tools/check_rules.py), its
      # commits without attribution lines among them.
      - name: Rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_rules.py --commits "$BASE..HEAD"
      # The cache is read here, never written: populate alone writes it.
      - name: The cache, read only
        if: steps.changes.outputs.code == 'true'
        run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      # Every app (the iPhone's, the Mac's, the Linux client, blue Visor's
      # Android APK), the Mac's test bundles, libraries and servers, in this
      # container (tools/ci/container_build.sh builds where it runs).
      - name: The apps
        if: steps.changes.outputs.code == 'true'
        run: tools/ci/container_build.sh "$GITHUB_JOB"
      # Bazel's server let go before SwiftPM builds beside it.
      - name: Bazel stopped
        if: steps.changes.outputs.code == 'true'
        run: bazel shutdown || true
      # The command-line server with SwiftPM, and the client's host services
      # on their own (a file that uses Foundation without importing it fails
      # here, as in Visor on Isomer). Its tests are verify's (linux). The
      # server alone: the client the package declares for apps that embed it
      # builds only against Apple's SwiftUI (Package.swift).
      - name: The command-line server on Linux
        if: steps.changes.outputs.code == 'true'
        env:
          VISOR_SERVER_ONLY: "1"
        run: |
          swift build --product visor-server
          swift build --target VisorServices

  # ---- main ----------------------------------------------------------------

  # The cache's one writer (Shireworks' `ci.populate` grants this job the
  # write): what a pull request's container job builds, for main's merged
  # tree, so the next pull request's build is mostly cache hits. No tests,
  # nothing published.
  populate:
    if: github.event_name == 'push'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The apps
        run: tools/ci/container_build.sh "$GITHUB_JOB"

  # ---- By hand: verify -----------------------------------------------------

  # The tests that need a Mac (the server's Apple side, the client, its
  # views, SSH): their .xctest bundles built on Linux
  # (tools/ci/mac_tests_build.sh), then run on one of GitHub's Macs (test).
  build-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      - run: tools/ci/mac_tests_build.sh "$RUNNER_TEMP/mac-tests.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-tests
          path: ${{ runner.temp }}/mac-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The bundles, on an xcode-27 runner (tools/ci/mac_tests_run.sh: `xcrun
  # xctest`, Xcode 27.2).
  test:
    needs: build-tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-tests
          path: ${{ runner.temp }}
      - run: tools/ci/mac_tests_run.sh "$RUNNER_TEMP/mac-tests.tar.gz" --logs "$RUNNER_TEMP/test-logs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs

  # Visor's client as another app takes it (Package.swift's VisorUI, which
  # Shireworks' Visor tab embeds), resolved with SwiftPM: Visor's own
  # resolution, and a stand-in host with swift-crypto 3.x
  # (tools/ci/client_package.sh).
  client-package:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    # It resolves and loads graphs, no build: the small runner (2 GB), so
    # the 12 GB ones go to the jobs that build.
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/client_package.sh "$RUNNER_TEMP/client-package"

  # The proof's apps: the iPhone app for Apple silicon's simulator, and
  # Visor.app (signed ad hoc, as a build on Linux is).
  build-apple:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh "$GITHUB_JOB" \
            --macos_cpus=arm64 --ios_multi_cpus=sim_arm64 \
            //applications/visor_ios //applications/visor_mac
      - uses: actions/upload-artifact@v4
        with:
          name: apps-ios
          path: .ci/proof-apps/visor_ios.ipa
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: apps-mac
          path: .ci/proof-apps/visor_mac.zip
          if-no-files-found: error
          retention-days: 1

  # Blue Visor's APK for x86_64, which GitHub's emulator is.
  build-android:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh "$GITHUB_JOB" \
            --compilation_mode=opt --android_platforms=@rules_android//:x86_64 \
            //applications/visor_android:visor_android_apk
      - uses: actions/upload-artifact@v4
        with:
          name: apps-android
          path: .ci/proof-apps/*.apk
          if-no-files-found: error
          retention-days: 1

  # The release's proof is five jobs side by side: the iPhone and Android,
  # each upright and on its side, and the Mac. Each opens the fixture's
  # screens one by one and pictures them, as Isomer's proof does its
  # stories. The iPhone app's UI cases are not in it (since 12 Nov 2026):
  # tools/ios_ui_tests.sh runs them.
  #
  # The iPhone app's fixture screens, in one orientation, on an iPhone 17
  # simulator (tools/ci/proof_ios.sh).
  #
  # It starts with the run, not after build-apple: the simulator boots (five
  # minutes of the job) while the apps build, and the script waits for their
  # artifact once it is up (tools/ci/await_artifact.sh).
  proof-ios:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v5
      - run: tools/ci/proof_ios.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part" "${{ matrix.orientation }}"
        env:
          PROOF_APPS_ARTIFACT: apps-ios
          PROOF_APPS_JOB: build-apple
          GH_TOKEN: ${{ github.token }}
      # The part whether its screens came up or not: a broken screen is what
      # the proof is for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-ios${{ matrix.orientation == 'landscape' && '-landscape' || '' }}
          path: ${{ runner.temp }}/part
          retention-days: 7

  # Visor.app's fixture screens (tools/ci/proof_mac.sh).
  proof-mac:
    needs: build-apple
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apps-mac
          path: ${{ runner.temp }}/apps
      - run: tools/ci/proof_mac.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-mac
          path: ${{ runner.temp }}/part
          retention-days: 7

  # Blue Visor's screens, in one orientation, on an Android emulator under
  # Ubuntu's KVM (tools/ci/proof_android.sh).
  proof-android:
    # With the run, as proof-ios: the emulator boots while the APK builds.
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v5
      - run: tools/ci/proof_android.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part" "${{ matrix.orientation }}"
        env:
          PROOF_APPS_ARTIFACT: apps-android
          PROOF_APPS_JOB: build-android
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-android${{ matrix.orientation == 'landscape' && '-landscape' || '' }}
          path: ${{ runner.temp }}/part
          retention-days: 7

  # The command-line server on Linux with SwiftPM: built, its tests run,
  # and the server tried, a throwaway session over its WebSocket
  # (tools/ci/linux_tests.sh, in the job's own container).
  linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      # The Linux tests, Bazel's swift_test targets in Swift Testing
      # (//tests:linux).
      - name: The tests
        run: bazel test --test_output=errors //tests:linux
      # Bazel's server let go before SwiftPM builds beside it.
      - run: bazel shutdown || true
      - run: tools/ci/linux_tests.sh

  # Blue Visor's web client (docs/isomer.md), built optimized
  # (tools/ci/container_blue_web.sh --build-only). Until the Mac Studio
  # nothing runs it: without --build-only the script goes on to its tests and
  # the end-to-end test in headless Chromium.
  blue-web:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      - run: tools/ci/container_blue_web.sh "$GITHUB_JOB" review --build-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # The command-line server on Windows, in a Windows VM leased from
  # Shireworks (tools/ci/windows_vm_tests.sh). Off until the Mac Studio (a
  # 16 GB VM). To bring it back: verify's `if`, and in verify's needs.
  windows:
    if: false
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/windows_vm_tests.sh

  # Blue Visor's web client on the iPhone: built in the job's container,
  # served on a Mac slot, pictured in an iOS lease's Mobile Safari
  # (tools/ci/blue_ios_lease.sh), against tests/snapshots. Off until the Mac
  # Studio. To bring it back: verify's `if`, and in verify's needs.
  blue-ios:
    if: false
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # exec: the runner's cancel reaches the script's trap, which releases
      # the leases.
      - name: Built on Linux, pictured on iOS leases
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          exec tools/ci/blue_ios_lease.sh --image "ghcr.io/attilathefun/visor-agent:${line%.*}" --run "$RUNNER_TEMP/blue-ios"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-ios-snapshots
          path: ${{ runner.temp }}/blue-ios
          if-no-files-found: ignore

  # The proof, from what the platforms pictured: each screen an item under
  # a stable id, in proof.zip (tools/ci/proof_make.sh; AttilaTheFun/reviews'
  # docs/PROOF_FORMAT.md, format 2), kept as the `proof` artifact. Nothing is
  # compared here: Reviews compares it with the prior release's, item by item
  # (Logan, 8 Nov 2026), so it runs in a container. It passes only when the
  # Mac's tests, Linux's, the web client and every platform's part did: its
  # success is the commit verified, which a release's alpha and the release
  # job ask for.
  verify:
    needs: [build-tests, test, linux, blue-web, client-package, build-apple, build-android, proof-ios, proof-mac, proof-android]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') }}
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
      - run: tools/ci/proof_make.sh "$RUNNER_TEMP/parts" "$RUNNER_TEMP/proof"
      # The proof's comparison with the prior release's, made once and kept
      # beside proof.json (proof-diff.json; AttilaTheFun/reviews'
      # docs/PROOF_FORMAT.md): Reviews shows it at once. Never fails the job.
      - name: The proof's comparison
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/proof/proof/proof.json" ] || exit 0
          python3 -I tools/ci/proof_diff.py make "$RUNNER_TEMP/proof/proof" || echo "::warning::the proof's comparison wasn't made"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          # proof.json and its files: GitHub zips them, so the artifact's
          # download is the proof as the release keeps it (proof.zip).
          path: ${{ runner.temp }}/proof/proof
          if-no-files-found: error
          retention-days: 90
      - if: needs.test.result != 'success' || needs.linux.result != 'success' || needs.blue-web.result != 'success' || needs.client-package.result != 'success' || needs.proof-ios.result != 'success' || needs.proof-mac.result != 'success' || needs.proof-android.result != 'success'
        run: |
          echo "::error::Not verified: the Mac's tests $TESTS, Linux's $LINUX, the web client $WEB, the client package $CLIENT, iPhone $IOS, Mac $MAC, Android $ANDROID"
          exit 1
        env:
          TESTS: ${{ needs.test.result }}
          LINUX: ${{ needs.linux.result }}
          WEB: ${{ needs.blue-web.result }}
          CLIENT: ${{ needs.client-package.result }}
          IOS: ${{ needs.proof-ios.result }}
          MAC: ${{ needs.proof-mac.result }}
          ANDROID: ${{ needs.proof-android.result }}

  # ---- By hand: proposals and AdHoc ----------------------------------------

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). A release's alone: a pre-release may still pin
  # a revision. In a container, as every job but the headful proofs
  # (Logan, 8 Nov 2026).
  pins:
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'release'
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tools/released_pins.sh

  # Visor's own Linux programs (tools/linux_programs.sh: visor-server, also
  # the agents' host, linked fully static), which alpha and adhoc seal into
  # Visor.app for the containers it makes: built in a container of Visor's
  # agent image leased from Shireworks (tools/ci/linux_programs.sh) and
  # handed over as a tar. It needs no version, so it runs beside verify.
  linux-programs:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((github.ref == 'refs/heads/main' && (inputs.run == 'prerelease' || inputs.run == 'release')) ||
       (github.ref != 'refs/heads/main' && inputs.run == 'adhoc'))
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: exec tools/ci/linux_programs.sh "$RUNNER_TEMP/linux-programs.tar"
      - run: tar -tvf "$RUNNER_TEMP/linux-programs.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs.tar
          retention-days: 7

  # The proposal (prerelease, or release once verify and pins passed), on
  # main: its version asked of Applications Server (0.N.M; the same again for
  # the same commit, so a run again burns no number) and stamped in
  # (tools/ci/next_version.sh); the iPhone and iPad app and Visor.app built
  # on Linux in the job's own container, optimized, as a release promotes
  # this very build. The iPhone's is a device build signed ad hoc with a
  # placeholder profile (--config=ci_device, CI holds none of the team's);
  # Visor.app is given Visor's Linux programs. The server signs each again
  # with its bundle id's own identity and profile as it publishes it
  # (tools/ci/publish_from_ci.sh), and notarizes the Mac's. Then the draft
  # release (tools/ci/propose_release.sh), with the builds as the server
  # signed them attached (tools/ci/attach_release.sh): what Applications
  # lists (AttilaTheFun/applications' docs/RELEASE_ASSETS.md). The job's
  # OIDC token says what it is; no key, profile or password here.
  alpha:
    needs: [verify, pins, linux-programs]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.linux-programs.result == 'success' &&
      (inputs.run == 'prerelease' ||
       (inputs.run == 'release' && needs.verify.result == 'success' && needs.pins.result == 'success'))
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    permissions:
      # The draft release.
      contents: write
      # The OIDC token Applications Server checks.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      # 0.N.M, the next of the committed line for the token's commit, stamped
      # into the checkout's Info.plists and never committed. No version is no
      # proposal.
      - name: Version
        id: version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: |
          tools/ci/next_version.sh Visor applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_mac/Info.plist
          version="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          case "$version" in
            "" | *.0) echo "::error::Applications Server gave no build version (the plist says \"$version\")"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Logan's line rule (8 Nov 2026): no proposal on a line already
      # published as a production release, so a release ends its line
      # (tools/ci/check_version_line.sh, AttilaTheFun/applications').
      - name: A line not yet released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/ci/check_version_line.sh "$VERSION"
      # The app group shared with Applications, and Applications' bundle ids
      # on a Mac (UpdateKit; tools/signing), from the repository's secrets,
      # so neither the public source nor a log names them. A build published
      # without the group would never check for updates, so none is made.
      - name: Update settings
        env:
          UPDATE_APP_GROUP: ${{ secrets.VISOR_UPDATE_APP_GROUP }}
          UPDATE_APPLICATIONS_BUNDLE_IDS: ${{ secrets.VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS }}
        run: |
          if [ -z "$UPDATE_APP_GROUP" ] || [ -z "$UPDATE_APPLICATIONS_BUNDLE_IDS" ]; then
            echo "::error::No VISOR_UPDATE_APP_GROUP or VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS secret: a build published without them never checks for updates"
            exit 1
          fi
          printf 'common --repo_env=VISOR_UPDATE_APP_GROUP=%s\ncommon --repo_env=VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS=%s\n' \
            "$UPDATE_APP_GROUP" "$UPDATE_APPLICATIONS_BUNDLE_IDS" >> .bazelrc.user
      # The line's released agent image (MAJOR.MINOR), named, unused in the
      # job's own container.
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          exec tools/ci/container_build.sh "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --config=alpha --config=ci_device --compilation_mode=opt //applications/visor_ios //applications/visor_mac
      # The server signs it again from the entitlements it carries: built
      # unsigned, it would lose the microphone.
      - name: Visor.app signed with its entitlements
        run: tools/ci/mac_app_signed.sh .ci/packages/visor_mac.zip com.apple.security.device.audio-input com.apple.developer.aps-environment
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - name: Visor's Linux programs into Visor.app
        run: tools/ci/mac_app_linux_programs.sh .ci/packages/visor_mac.zip "$RUNNER_TEMP/linux-programs/linux-programs.tar"
      # The commit's message, from git: a run by hand has no head_commit.
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: |
          set -o pipefail
          tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" --download "$RUNNER_TEMP/assets" \
            .ci/packages/*.ipa .ci/packages/visor_mac.zip | tee "$RUNNER_TEMP/published.txt"
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.run }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/ci/propose_release.sh "$KIND" "$VERSION" "$RUNNER_TEMP/published.txt"
      # A release's proposal: the proof verify made of this commit, saying
      # the version, among the assets, so the draft and the release keep it
      # (AttilaTheFun/reviews' docs/PROOF_FORMAT.md).
      - uses: actions/download-artifact@v4
        if: inputs.run == 'release'
        with:
          name: proof
          path: ${{ runner.temp }}/proof
      - name: The proof among the assets
        if: inputs.run == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/ci/proof_version.sh "$RUNNER_TEMP/proof" "$VERSION" "$RUNNER_TEMP/assets/proof.zip"
          if [ -f "$RUNNER_TEMP/proof/proof-diff.json" ]; then cp "$RUNNER_TEMP/proof/proof-diff.json" "$RUNNER_TEMP/assets/"; fi
      # The Alphas on the draft: Visor-<version>-ios.ipa, -macos.zip and
      # builds.json, which Applications reads (and a release's proof.zip).
      - name: The builds on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/ci/attach_release.sh "v$VERSION" "$RUNNER_TEMP/assets"

  # Visor's images (tools/containers/visor-agent/Dockerfile) of the
  # proposal's version, built with buildah in a visor-jit container, as every
  # job but the headful proofs (Logan, 8 Nov 2026), and pushed to GitHub's
  # registry as that version, its MAJOR.MINOR and latest:
  # the runtime target as ghcr.io/attilathefun/visor, which a Visor server of
  # that version makes sessions' containers from, and the build target, with
  # the toolchains, as ghcr.io/attilathefun/visor-agent, CI's containers' and
  # the co-tenant's.
  # Whether Visor's toolchain image is to be built: by hand (`run:
  # agent-image`), or in a release whose tools/containers/ changed since the
  # release before it. Not in every release: it changes rarely, and building
  # it took ten minutes and a 12 GB runner of each. On the small runner.
  agent-image-wanted:
    needs: alpha
    if: ${{ !cancelled() && (inputs.run == 'agent-image' || needs.alpha.result == 'success') }}
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 10
    outputs:
      build: ${{ steps.changed.outputs.build }}
      version: ${{ steps.changed.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: changed
        env:
          RUN: ${{ inputs.run }}
          VERSION: ${{ needs.alpha.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2> /dev/null || true)"
          # By hand, between releases: the last release's version and this
          # commit, so its tags (0.56.1, 0.56) keep their image.
          echo "version=${VERSION:-${previous#v}-$(git rev-parse --short=7 HEAD)}" >> "$GITHUB_OUTPUT"
          if [ "$RUN" = agent-image ] || [ -z "$previous" ] || ! git diff --quiet "$previous" HEAD -- tools/containers; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "tools/containers/ hasn't changed since $previous: the image stays as it is"
          fi

  # Visor's toolchain image (ghcr.io/attilathefun/visor-agent), which CI's
  # containers and Shireworks' primary container run, when wanted.
  agent-image:
    needs: [alpha, agent-image-wanted]
    if: ${{ !cancelled() && needs.agent-image-wanted.outputs.build == 'true' }}
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: tools/containers/publish_agent_image.sh "$VERSION"
        env:
          VERSION: ${{ needs.agent-image-wanted.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

  # AdHoc: a branch other than main built by hand (`run: adhoc`), the iPhone
  # and iPad app and Visor.app built as alpha's are with --config=adhoc and
  # published; the server takes them as AdHoc builds, kept a week
  # (AttilaTheFun/applications' docs/VARIANTS.md).
  adhoc:
    needs: linux-programs
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'adhoc' && github.ref != 'refs/heads/main'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/next_version.sh Visor applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_mac/Info.plist
      # The app group shared with Applications, and Applications' bundle ids
      # on a Mac (UpdateKit; tools/signing), from the repository's secrets,
      # so neither the public source nor a log names them. A build published
      # without the group would never check for updates, so none is made.
      - name: Update settings
        env:
          UPDATE_APP_GROUP: ${{ secrets.VISOR_UPDATE_APP_GROUP }}
          UPDATE_APPLICATIONS_BUNDLE_IDS: ${{ secrets.VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS }}
        run: |
          if [ -z "$UPDATE_APP_GROUP" ] || [ -z "$UPDATE_APPLICATIONS_BUNDLE_IDS" ]; then
            echo "::error::No VISOR_UPDATE_APP_GROUP or VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS secret: a build published without them never checks for updates"
            exit 1
          fi
          printf 'common --repo_env=VISOR_UPDATE_APP_GROUP=%s\ncommon --repo_env=VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS=%s\n' \
            "$UPDATE_APP_GROUP" "$UPDATE_APPLICATIONS_BUNDLE_IDS" >> .bazelrc.user
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          exec tools/ci/container_build.sh "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --config=adhoc --config=ci_device --compilation_mode=opt //applications/visor_ios //applications/visor_mac
      # The server signs it again from the entitlements it carries: built
      # unsigned, it would lose the microphone.
      - name: Visor.app signed with its entitlements
        run: tools/ci/mac_app_signed.sh .ci/packages/visor_mac.zip com.apple.security.device.audio-input com.apple.developer.aps-environment
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - name: Visor's Linux programs into Visor.app
        run: tools/ci/mac_app_linux_programs.sh .ci/packages/visor_mac.zip "$RUNNER_TEMP/linux-programs/linux-programs.tar"
      # The branch's commit's message, from git: a run by hand has no
      # head_commit in its event.
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.ipa .ci/packages/visor_mac.zip

  # ---- Released ------------------------------------------------------------

  # Production, when Logan releases a proposed release in Reviews (never a
  # pre-release). Nothing is built: the commit must be on main and verified
  # (tools/ci/verified_run.sh: a run by hand whose verify passed and kept its
  # proof), then Applications Server promotes the Alphas alpha published of
  # it, the builds Logan tested, stamping them Production and signing them
  # again (tools/ci/promote_from_ci.sh, AttilaTheFun/applications'
  # docs/CI.md, "Production by promotion"). The token's v* tag, released by
  # a releaser, is the permission. An Alpha that isn't its app's newest is
  # kept a week, so a release is made within a week of its proposal (or
  # while its Alphas are still the newest). The promoted builds, the Mac's
  # disk image among them (which the server makes as it promotes Visor.app),
  # are handed to release-assets.
  release:
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      # The OIDC token Applications Server checks.
      id-token: write
    outputs:
      verified: ${{ steps.verified.outputs.run }}
    steps:
      # The release's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A release is a main commit: a tag on any other stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      - name: The release was verified
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        # An assignment, so that the script's failure fails the step.
        run: |
          run="$(tools/ci/verified_run.sh "$(git rev-parse HEAD)")" \
            || { echo "::error::$GITHUB_REF_NAME's commit was not verified: nothing promoted"; exit 1; }
          echo "Verified by run $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          BODY: ${{ github.event.release.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
      - name: Promote
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/promote_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" --download "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7

  # The release's Production builds among its files on GitHub, in place of
  # its Alphas under the same names (AttilaTheFun/applications'
  # docs/RELEASE_ASSETS.md): Visor-<version>-ios.ipa, -macos.zip, the
  # notarized -macos.dmg (Logan, 5 Nov 2026) and builds.json, which
  # Applications reads. Then the proof that verified it
  # (tools/ci/release_proof.sh), for the next release's to be compared
  # with. A job of its own, so that the one reaching Applications Server
  # (release) keeps a read-only token; in a container, as every job but the
  # headful proofs (Logan, 8 Nov 2026). gh as gh_ready.sh installs it.
  release-assets:
    needs: release
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - run: tools/ci/attach_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: tools/ci/release_proof.sh "$GITHUB_REF_NAME" --run "$VERIFIED"
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ needs.release.outputs.verified }}
