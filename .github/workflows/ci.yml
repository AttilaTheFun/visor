name: CI
# Pull requests get the fast checks, all at once, each on a machine leased
# from OS Server by the repository's own runners: every app built on Linux
# (the container job), the tests with nothing of Apple's in them on Linux,
# the command-line server on Windows, the tests that need a Mac in a macOS
# VM, and blue's web client in headless Chromium in a Linux container. A
# diff of documentation alone (docs/, .notes/, Markdown) skips them, and a
# skipped job passes. Each commit merged to main gets them too, then what a
# release is made of: its number, its packages built, signed and published
# to Releases (the release Mac's runner, self-hosted, release-mac), the
# agent image and blue's iPhone snapshots. The proof (the phone app's
# fixture screens and its UI cases) runs only when asked for by hand
# (workflow_dispatch), which is how an agent proposes a release: on main,
# compared with the pictures kept at the previous release (the newest v*
# tag before the commit, else the commit before). Reviews reads it from the
# run's `proof` artifact, and no release is made without a proof of its
# commit. To bisect a regression, prove an earlier commit after the fact:
# push a branch at it and run the workflow on that branch. A newer push to a
# pull request cancels its run if it hasn't finished. main requires every
# job green (or skipped) on a pull request's head before it merges. A
# fork's pull request never runs on a self-hosted runner. The jobs that only
# lease what they run in (changes, test, linux, windows, pins) run on OS
# Server's single-use runners (visor-jit): each a fresh Linux container with
# `oss` on its PATH. Those that need the Mac itself stay on its own runners:
# the release Mac's, the container builds (which mount this checkout), blue's
# iPhone snapshots and the proof (Xcode's tools on the runner).
on:
  pull_request:
  push:
    branches: [main]
  # The proof, by hand: to propose a release, or to bisect.
  workflow_dispatch:
    inputs:
      kind:
        description: The proof's kind (full also runs the UI cases)
        type: choice
        options: [full, quick]
        default: full
concurrency:
  # A proof run is its own: it never waits on, or replaces, main's builds.
  group: ${{ github.event_name == 'workflow_dispatch' && format('proof-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  # main's runs are never cut short: their builds are a release's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  actions: read
# Whom the jobs' OS Server leases are for (OS Server's API 12): with the
# runner's `ci` key (~/.config/oss/key), each lease is `<job>-<run>@ci`.
env:
  OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
jobs:
  # Whether the pull request changes anything but documentation; a push to
  # main always does.
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The tests that need a Mac (the server's Apple side, the client, its
  # views, SSH), in a macOS VM leased from OS Server
  # (tools/ci/mac_vm_tests.sh). Every target is built in the container job.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_tests.sh

  # The command-line server on Linux: built, its tests run, and the server
  # itself tried — run, a throwaway session over its WebSocket, restarted,
  # stopped (tools/probes/command_line_server.sh). No agent CLI needed.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # In a container of Visor's agent image leased from OS Server
      # (tools/ci/linux_tests.sh), which it releases however it ends.
      - run: exec tools/ci/linux_tests.sh

  # The command-line server on Windows: built, and tried — run, a throwaway
  # session over its WebSocket, stopped through its REST side — in a Windows
  # VM leased from OS Server (tools/ci/windows_vm_tests.sh).
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/windows_vm_tests.sh

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). Run on main's commits, which releases are of;
  # a pull request may still pin a revision. Reviews holds a release until
  # it passes.
  # The proof of each commit merged to main: the phone app's fixture
  # screens, in portrait and on its side, and its UI cases, made in a macOS
  # VM leased from OS Server (tools/ci/mac_vm_proof.sh), each screen
  # compared with its picture kept at the commit before (tests/proof/ios,
  # ios-landscape: red's own; tests/snapshots holds blue's). Reviews reads
  # the `proof` artifact from GitHub: a release is proposed on a commit
  # whose proof is in, and that is the proof reviewed. Within the hour.
  proof:
    # Only when asked for by hand: never a pull request's or a push's.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, visor-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The history and the tags: the previous release's kept pictures
          # are what the screens are compared with.
          fetch-depth: 0
          fetch-tags: true
      - name: The phone app in a macOS VM, and the proof
        env:
          PROOF_KIND: ${{ inputs.kind || 'full' }}
        # The previous release (the newest v* tag before this commit), else
        # the commit before. exec: the runner's cancel reaches the script's
        # trap, which releases the VM.
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2> /dev/null || git rev-parse HEAD^)"
          echo "Compared with $base"
          exec tools/ci/mac_vm_proof.sh --kind "$PROOF_KIND" --base "$base" --proof "$RUNNER_TEMP/proof"
      # The proof whether the screens came up or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  pins:
    if: github.event_name == 'push'
    runs-on: [self-hosted, visor-jit]
    steps:
      - uses: actions/checkout@v4
      - run: tools/released_pins.sh

  # The version this commit's build takes, and its proof is filed under:
  # MAJOR.MINOR.BUILD, BUILD one past the line's highest on the release
  # server (the plist says MAJOR.MINOR.0), kept there as the commit's.
  number:
    if: github.event_name == 'push'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: next
        run: echo "version=$($PIPELINE_CI number Visor applications/visor_ios/Info.plist)" >> "$GITHUB_OUTPUT"
        env:
          # The commit itself (a pull request's head, not its merge ref).
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The commit's packages (the iPhone's .ipa, the Mac's apps signed and
  # notarized) at that number, published to Releases as main's beta. What is
  # done with them is the runner's ($PIPELINE_CI).
  build:
    needs: number
    if: github.event_name == 'push'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: $PIPELINE_CI prepare
      - run: $PIPELINE_CI stamp ${{ needs.number.outputs.version }} applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_macos/Info.plist applications/visor_menubar/Info.plist applications/visor_container_host/Info.plist
      - run: tools/build_packages.sh
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}

  # Visor's agent image (tools/containers/visor-agent), which sessions'
  # containers are made from: built on the release Mac (Apple's container)
  # and pushed to GitHub's registry as this build's version and its
  # MAJOR.MINOR (ghcr.io/attilathefun/visor-agent), which a Visor server of
  # that version asks its OS Server for.
  agent-image:
    needs: number
    if: github.event_name == 'push'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: tools/containers/publish_agent_image.sh ${{ needs.number.outputs.version }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

  # The apps built on Linux where a session's agent builds them: in a
  # container of Visor's agent image, leased from the OS Server on the
  # runner's Mac (self-hosted, oss-container), the Apple apps with
  # rules_applecross from that server's files, the Linux client, blue
  # Visor's Android APK, and the Mac's libraries and servers
  # (tools/ci/container_build.sh).
  # A fork's pull request never runs there.
  container:
    needs: [changes, number, agent-image]
    # On a pull request number and agent-image are skipped, and it runs all the same.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 90
    # One build at a time on the runner's Mac, as Bazel's tree is one kept
    # volume: OS Server holds a lease whose volume another lease has until
    # it is free (`oss machine run` waits). No job-level group, which kept
    # one job pending and cancelled any other.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # main's commit in its own agent image; a pull request in its line's
      # released one (MAJOR.MINOR).
      - id: image
        env:
          VERSION: ${{ needs.number.outputs.version }}
        run: |
          line="$(plutil -extract CFBundleShortVersionString raw applications/visor_ios/Info.plist)"
          echo "tag=${VERSION:-${line%.*}}" >> "$GITHUB_OUTPUT"
      # exec: the runner's cancel reaches oss, which releases the container.
      - run: exec bazel run //tools/ci:container_build -- ghcr.io/attilathefun/visor-agent:${{ steps.image.outputs.tag }}

  # Blue Visor (the client on Isomer: docs/isomer.md), its web client: built
  # optimized, its tests run, then checked in headless Chromium: the
  # end-to-end test against the stand-in server on its three roads, the
  # transcript's layout and the composer typed into. In a container of the
  # line's agent image leased from the OS Server on the runner's Mac
  # (tools/ci/container_blue_web.sh). Its Android APK is built in the
  # container job.
  blue-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 60
    # One at a time on the runner's Mac, as its Bazel tree is one kept
    # volume: OS Server holds the lease until the volume is free.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: image
        run: |
          line="$(plutil -extract CFBundleShortVersionString raw applications/visor_ios/Info.plist)"
          echo "tag=${line%.*}" >> "$GITHUB_OUTPUT"
      # exec: the runner's cancel reaches oss, which releases the container.
      - run: exec bazel run //tools/ci:container_blue_web -- ghcr.io/attilathefun/visor-agent:${{ steps.image.outputs.tag }} review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # Blue Visor on the iPhone, on each commit to main (its snapshots are
  # proof-like): the WasmKit app and the one compiled against Isomer's
  # frameworks, for the simulator (no signing team needed), then its
  # fixture's screens in each orientation and the web client's in Mobile
  # Safari, against tests/snapshots. On the release Mac: GitHub's
  # hosted Mac minutes are billed. The harness makes its simulators and
  # removes them after.
  blue-ios:
    if: github.event_name == 'push'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build
        run: >
          bazel build -c opt --ios_multi_cpus=sim_arm64
          //applications/visor_isomer_ios
          //applications/visor_isomer_compiled_ios
      # Mobile Safari's simulator is this job's own, made new for the run and
      # deleted after it (the iPhone fixture's runner makes and deletes its
      # own), so it never meets the proof's or the releases runner's.
      - name: A fresh simulator for Mobile Safari
        run: |
          xcrun simctl list -j devices | python3 -c 'import json, sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"] == "blue-ci-web-mobile"]' |
            while read -r udid; do xcrun simctl shutdown "$udid" 2>/dev/null || true; xcrun simctl delete "$udid"; done
      - name: Snapshots
        run: python3 tools/isomer/snapshots/snapshots.py run --targets ios,ios-landscape,web-mobile
        env:
          VISOR_SNAPSHOT_RUN_DIR: ${{ runner.temp }}/blue-snapshots
          VISOR_SNAPSHOT_SIMULATOR: blue-ci-web-mobile
      - name: Delete Mobile Safari's simulator
        if: always()
        run: |
          xcrun simctl list -j devices | python3 -c 'import json, sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"] == "blue-ci-web-mobile"]' |
            while read -r udid; do xcrun simctl shutdown "$udid" 2>/dev/null || true; xcrun simctl delete "$udid"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-ios-snapshots
          path: ${{ runner.temp }}/blue-snapshots
          if-no-files-found: ignore
