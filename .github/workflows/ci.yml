name: CI
# Pull requests get the fast checks, all at once, each on a machine leased
# from OS Server by the repository's own runners: every app built on Linux
# (the container job), the tests with nothing of Apple's in them on Linux,
# the command-line server on Windows, the tests that need a Mac in a macOS
# VM, and blue's web client in headless Chromium in a Linux container. A
# diff of documentation alone (docs/, .notes/, Markdown) skips them, and a
# skipped job passes. Each commit merged to main gets them too, then its
# builds (Logan, 2026-11-02: AdHoc by hand before a merge, an Alpha for each
# commit after it, Production at a release, nothing else): the iPhone and
# iPad app built on Linux and published to Applications Server, which signs
# it (alpha; adhoc by hand on a pull request's branch; their OIDC token says
# which: tools/ci/publish_from_ci.sh). A release is no build of its own:
# Applications Server promotes a commit's Alpha, as tested, to Production
# (the plist's BuildVariant restamped, signed again), from a release
# branch's call once its route exists. Then the Mac's disk images, their
# number and the agent image on the release Mac (self-hosted, release-mac,
# until the Mac moves to Visor.app), and blue's iPhone snapshots. The proof (the phone app's
# fixture screens and its UI cases) runs only when asked for by hand
# (workflow_dispatch), which is how an agent proposes a release: on main,
# compared with the pictures kept at the previous release (the newest v*
# tag before the commit, else the commit before). Reviews reads it from the
# run's `proof` artifact, and no release is made without a proof of its
# commit. To bisect a regression, prove an earlier commit after the fact:
# push a branch at it and run the workflow on that branch. A newer push to a
# pull request cancels its run if it hasn't finished. main requires every
# job green (or skipped) on a pull request's head before it merges. A
# fork's pull request never runs on a self-hosted runner. The jobs that only
# lease what they run in (changes, test, linux, windows, pins) run on OS
# Server's single-use runners (visor-jit): each a fresh Linux container with
# `oss` on its PATH. Those that need the Mac itself stay on its own runners:
# the release Mac's, the container builds (which mount this checkout), blue's
# iPhone snapshots and the proof (Xcode's tools on the runner).
on:
  pull_request:
  push:
    branches: [main]
  # By hand: the proof, to propose a release or to bisect; on a pull
  # request's branch, its AdHoc build (adhoc).
  workflow_dispatch:
    inputs:
      kind:
        description: The proof's kind (full also runs the UI cases)
        type: choice
        options: [full, quick]
        default: full
concurrency:
  # A pull request's newer push replaces its older run. Every other run (a
  # commit on main, a proof by hand) is a group of its own: GitHub keeps one
  # pending run per group and cancels the rest, so main's runs sharing one
  # left a commit queued between two others with no build.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  # main's runs are never cut short: their builds are a release's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  actions: read
# Whom the jobs' OS Server leases are for (OS Server's API 12): with the
# runner's `ci` key (~/.config/oss/key), each lease is `<job>-<run>@ci`.
env:
  OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
jobs:
  # Whether the pull request changes anything but documentation; a push to
  # main always does.
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The tests that need a Mac (the server's Apple side, the client, its
  # views, SSH): their .xctest bundles built on Linux in this job's own
  # container (tools/ci/build_mac_tests.sh), and only run on a slot of OS
  # Server's primary Mac (`oss machine xctest`), which gets the bundles
  # alone, no tree and no Bazel (tools/ci/mac_vm_tests.sh).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_tests.sh --logs "$RUNNER_TEMP/test-logs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs

  # The command-line server on Linux: built, its tests run, and the server
  # itself tried — run, a throwaway session over its WebSocket, restarted,
  # stopped (tools/probes/command_line_server.sh). No agent CLI needed.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # In a container of Visor's agent image leased from OS Server
      # (tools/ci/linux_tests.sh), which it releases however it ends.
      - run: exec tools/ci/linux_tests.sh

  # The command-line server on Windows: built, and tried — run, a throwaway
  # session over its WebSocket, stopped through its REST side — in a Windows
  # VM leased from OS Server (tools/ci/windows_vm_tests.sh).
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/windows_vm_tests.sh

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). Run on main's commits, which releases are of;
  # a pull request may still pin a revision. Reviews holds a release until
  # it passes.
  # The proof of each commit merged to main: the phone app's fixture
  # screens, in portrait and on its side, and its UI cases: the app and its
  # probe built on Linux in a container leased from OS Server, and run on an
  # iOS lease (tools/ci/ios_lease_proof.sh), each screen
  # compared with its picture kept at the commit before (tests/proof/ios,
  # ios-landscape: red's own; tests/snapshots holds blue's). Reviews reads
  # the `proof` artifact from GitHub: a release is proposed on a commit
  # whose proof is in, and that is the proof reviewed. Within the hour.
  proof:
    # Only when asked for by hand: never a pull request's or a push's.
    if: github.event_name == 'workflow_dispatch'
    # On the Mac whose OS Server leases the build's container, which mounts
    # this checkout (as the container job): a runner elsewhere has no folder
    # it can share. Xcode there reads the result bundles.
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The history and the tags: the previous release's kept pictures
          # are what the screens are compared with.
          fetch-depth: 0
          fetch-tags: true
      - name: The phone app built on Linux, run on an iOS lease, and the proof
        env:
          PROOF_KIND: ${{ inputs.kind || 'full' }}
        # The previous release (the newest v* tag before this commit), else
        # the commit before. The container is the line's released agent
        # image (MAJOR.MINOR), as a pull request's container job takes.
        # exec: the runner's cancel reaches the script's trap, which
        # releases the leases.
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2> /dev/null || git rev-parse HEAD^)"
          echo "Compared with $base"
          line="$(plutil -extract CFBundleShortVersionString raw applications/visor_ios/Info.plist)"
          exec tools/ci/ios_lease_proof.sh --image "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --kind "$PROOF_KIND" --base "$base" --proof "$RUNNER_TEMP/proof"
      # The proof whether the screens came up or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  pins:
    if: github.event_name == 'push'
    runs-on: [self-hosted, visor-jit]
    steps:
      - uses: actions/checkout@v4
      - run: tools/released_pins.sh

  # The version the Mac's disk images and the agent image of this commit of
  # main take: MAJOR.MINOR.BUILD, BUILD one past the line's highest on the
  # release server (the plist says MAJOR.MINOR.0), kept there as the
  # commit's. The iPhone's comes from Applications Server
  # (tools/ci/next_version.sh, in alpha and adhoc).
  number:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: next
        run: echo "version=$($PIPELINE_CI number Visor applications/visor_ios/Info.plist)" >> "$GITHUB_OUTPUT"
        env:
          # The commit itself (a pull request's head, not its merge ref).
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The Mac's disk images of this commit of main (Visor and Visor Server,
  # signed and notarized) at that number, published by the release Mac's
  # runner ($PIPELINE_CI), until the Mac moves to Visor.app and to
  # Applications Server as the iPhone has (alpha). Named `build` still:
  # main's branch protection requires a check of that name, which a pull
  # request's run reports as skipped.
  build:
    needs: [number, linux-programs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: $PIPELINE_CI prepare
      - run: $PIPELINE_CI stamp ${{ needs.number.outputs.version }} applications/visor_macos/Info.plist applications/visor_menubar/Info.plist applications/visor_container_host/Info.plist
      # Visor's own Linux programs, which Visor Server carries
      # (tools/release_mac.sh), from the linux-programs job.
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - run: tools/build_packages.sh
        env:
          VISOR_LINUX_PROGRAMS: ${{ runner.temp }}/linux-programs/linux-programs.tar
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}

  # Visor's own Linux programs (tools/linux_programs.sh: visor-server, also
  # the agents' host, linked fully static), which the build job seals into
  # Visor Server for the containers it makes: built in a container of
  # Visor's agent image leased from the OS Server on the runner's Mac
  # (tools/ci/linux_programs.sh), as the release Mac has none, and handed
  # over as a tar. Not waiting on number: it needs no version.
  linux-programs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: exec tools/ci/linux_programs.sh "$RUNNER_TEMP/linux-programs.tar"
      - run: tar -tvf "$RUNNER_TEMP/linux-programs.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs.tar
          retention-days: 7

  # Visor's images (tools/containers/visor-agent/Dockerfile), built on the
  # release Mac (Apple's container) and pushed to GitHub's registry as this
  # build's version, its MAJOR.MINOR and latest: its runtime target as
  # ghcr.io/attilathefun/visor, which a Visor server of that version makes
  # sessions' containers from, and its build target, with the toolchains, as
  # ghcr.io/attilathefun/visor-agent, CI's containers' and the co-tenant's.
  agent-image:
    needs: number
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: tools/containers/publish_agent_image.sh ${{ needs.number.outputs.version }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

  # The apps built on Linux where a session's agent builds them: in a
  # container of Visor's agent image, leased from the OS Server on the
  # runner's Mac (self-hosted, oss-container), the Apple apps with
  # rules_applecross from that server's files, the Linux client, blue
  # Visor's Android APK, and the Mac's libraries and servers
  # (tools/ci/container_build.sh).
  # A fork's pull request never runs there.
  container:
    needs: [changes, number, agent-image]
    # On a pull request number and agent-image are skipped, and it runs all the same.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    # In a container of its own (visor-jit), side by side with the other
    # jobs, its Bazel reading OS Server's cache (tools/ci/container_build.sh
    # builds where it runs): no runner's Mac between jobs, no kept volume.
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # The agent image a build on a Mac would use (main's commit's own, a
      # pull request its line's): named, unused in the job's own container.
      - id: image
        env:
          VERSION: ${{ needs.number.outputs.version }}
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          echo "tag=${VERSION:-${line%.*}}" >> "$GITHUB_OUTPUT"
      - run: exec tools/ci/container_build.sh ghcr.io/attilathefun/visor-agent:${{ steps.image.outputs.tag }}

  # Blue Visor (the client on Isomer: docs/isomer.md), its web client: built
  # optimized, its tests run, then checked in headless Chromium: the
  # end-to-end test against the stand-in server on its three roads, the
  # transcript's layout and the composer typed into. In a container of the
  # line's agent image leased from the OS Server on the runner's Mac
  # (tools/ci/container_blue_web.sh). Its Android APK is built in the
  # container job.
  blue-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # In a container of its own (visor-jit), side by side with the other
    # jobs (tools/ci/container_blue_web.sh runs where it runs).
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: image
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          echo "tag=${line%.*}" >> "$GITHUB_OUTPUT"
      - run: exec tools/ci/container_blue_web.sh ghcr.io/attilathefun/visor-agent:${{ steps.image.outputs.tag }} review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # Blue Visor on the iPhone, on each commit to main (its snapshots are
  # proof-like): the WasmKit app, the one compiled against Isomer's
  # frameworks, its fixture probe and the web site built in a Linux
  # container, then pictured on iOS leases (tools/ci/blue_ios_lease.sh): the
  # fixture's screens in each orientation and the web client's in Mobile
  # Safari, against tests/snapshots. On the Mac whose OS Server leases the
  # build's container, which mounts this checkout, and serves the web site
  # to the lease's simulator on its loopback; Xcode there reads the result
  # bundles.
  blue-ios:
    # main's commits, and by hand (with the proof): a branch's run tries it
    # before it merges.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The line's released agent image (MAJOR.MINOR), as the proof takes.
      # exec: the runner's cancel reaches the script's trap, which releases
      # the leases.
      - name: Built on Linux, pictured on iOS leases
        run: |
          line="$(plutil -extract CFBundleShortVersionString raw applications/visor_ios/Info.plist)"
          exec tools/ci/blue_ios_lease.sh --image "ghcr.io/attilathefun/visor-agent:${line%.*}" --run "$RUNNER_TEMP/blue-ios"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-ios-snapshots
          path: ${{ runner.temp }}/blue-ios
          if-no-files-found: ignore

  # The Alpha of each commit on main (--config=alpha), never a pull
  # request's: its version asked of Applications Server and stamped in
  # (tools/ci/next_version.sh), the iPhone and iPad app built on Linux in a
  # container leased from the OS Server on the runner's Mac
  # (tools/ci/container_build.sh, VISOR_CI_PACKAGE): a device build signed
  # ad hoc with a placeholder profile (--config=ci_device, CI holds none of
  # the team's), which the server signs again with each bundle id's own when
  # it is published (tools/ci/publish_from_ci.sh). After the container job:
  # nothing is published from a tree that doesn't build. The job's OIDC
  # token says what it is; no key, profile or password here.
  alpha:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 90
    permissions:
      contents: read
      # The OIDC token Applications Server checks.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # 0.43.N, the next of the committed line for the token's commit,
      # stamped into the checkout's Info.plists and never committed.
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/next_version.sh Visor applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist
      # The line's released agent image (MAJOR.MINOR), as the proof takes.
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
          VISOR_CI_VOLUME: visor-ci-alpha
        run: |
          line="$(plutil -extract CFBundleShortVersionString raw applications/visor_ios/Info.plist)"
          exec bazel run //tools/ci:container_build -- "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --config=alpha --config=ci_device //applications/visor_ios
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          SUMMARY: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$SUMMARY" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.ipa

  # AdHoc: a pull request's branch built by hand (workflow_dispatch on a
  # branch that is neither main nor a release branch), the iPhone and iPad
  # app built as alpha's is with --config=adhoc and published; the server
  # takes it as an AdHoc build, kept a week (AttilaTheFun/applications'
  # docs/VARIANTS.md). Not after the container job, which a run by hand
  # skips: the build itself stops a tree that doesn't build.
  adhoc:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-')
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/next_version.sh Visor applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
          VISOR_CI_VOLUME: visor-ci-adhoc
        run: |
          line="$(plutil -extract CFBundleShortVersionString raw applications/visor_ios/Info.plist)"
          exec bazel run //tools/ci:container_build -- "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --config=adhoc --config=ci_device //applications/visor_ios
      # The branch's commit's message, from git: a run by hand has no
      # head_commit in its event.
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.ipa
