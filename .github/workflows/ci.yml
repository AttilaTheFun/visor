name: CI
# Every commit pushed to a pull request, and each one merged to main (a
# squash is a commit of its own): the fast checks, the tests and every
# platform's build; then, on the release Mac's runner (self-hosted,
# release-mac), the commit's packages built, signed and published to
# Releases. Everything runs on self-hosted runners: the repository's own
# (visor-ci) leases what each job runs in from OS Server — a macOS VM
# (tools/ci/mac_vm.sh) or a Linux container — and the release Mac's builds
# the packages. Each commit merged to main has its proof made too (the phone
# app's fixture screens and its UI cases, compared with the pictures kept
# at the commit before), on the repository's own runner in a macOS VM
# leased from OS Server; Reviews reads it from the run's `proof` artifact,
# and a release is proposed on a commit whose proof is in. A pull request
# runs no proof: its builds and tests only. A newer push
# to the pull request cancels this run if it hasn't finished. main requires every job green on a pull request's head
# commit before it merges. A fork's pull request never runs on a
# self-hosted runner.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # main's runs are never cut short: their builds are a release's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  actions: read
# Whom the jobs' OS Server leases are for (OS Server's API 12): with the
# runner's `ci` key (~/.config/oss/key), each lease is `<job>-<run>@ci`.
env:
  OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
jobs:
  # The build for the Mac and the iPhone and the libraries' tests, in a
  # macOS VM leased from OS Server (tools/ci/mac_vm_tests.sh): every target
  # compiles in the Swift 6 mode with warnings as errors (tools/swift), so
  # building is a check of its own.
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_tests.sh

  # The phone app itself, in the simulator: the probe's cases that need no
  # computer, on the snapshot fixture. The thread must not move when it
  # learns there are rows before it (the jump on the first send after a
  # launch, 0.26). A simulator build needs no signing team.
  xcode26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build (macOS)
        run: >
          bazel build
          //libraries/...
          //tools/staging_server
          //applications/visor_container_host:visor-container-host
          //applications/visor_macos:macos_lib
          //applications/visor_menubar:menubar_lib
      - name: Build (iOS)
        run: >
          bazel build --platforms=@apple_support//platforms:ios_sim_arm64
          //libraries/visor_ui
          //applications/visor_ios:ios_lib
          //applications/visor_ios:widget_lib
      - name: Test
        run: >
          bazel test --test_output=errors
          //tests/visor_server_tests
          //tests/visor_container_host_tests
          //tests/visor_client_tests
          //tests/visor_ui_tests
          //tests/visor_ssh_tests
          //tests/message_cache_tests
          //tests/claude_transcript_tests

  # The command-line server on Linux: built, its tests run, and the server
  # itself tried — run, a throwaway session over its WebSocket, restarted,
  # stopped (tools/probes/command_line_server.sh). No agent CLI needed.
  linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # In a container of Visor's agent image leased from OS Server
      # (tools/ci/linux_tests.sh), which it releases however it ends.
      - run: exec tools/ci/linux_tests.sh

  # The command-line server on Windows: built, and tried — run, a throwaway
  # session over its WebSocket, stopped through its REST side.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.4.0-release
          tag: 6.4.0-RELEASE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: swift build --product visor-server
      - name: Try the server
        shell: pwsh
        run: |
          $server = ".build\debug\visor-server.exe"
          $password = & $server password
          Start-Process -FilePath $server -ArgumentList "run","--port","7633" -NoNewWindow `
            -RedirectStandardOutput server.log -RedirectStandardError server-errors.log
          Start-Sleep 3
          $env:VISOR_PORT = "7633"; $env:VISOR_TOKEN = $password; $env:QUIT = "1"
          node tools/probes/server.mjs
          $status = $LASTEXITCODE
          Get-Content server.log, server-errors.log
          exit $status

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). Run on main's commits, which releases are of;
  # a pull request may still pin a revision. Reviews holds a release until
  # it passes.
  # The proof of each commit merged to main: the phone app's fixture
  # screens, in portrait and on its side, and its UI cases, made in a macOS
  # VM leased from OS Server (tools/ci/mac_vm_proof.sh), each screen
  # compared with its picture kept at the commit before (tests/proof/ios,
  # ios-landscape: red's own; tests/snapshots holds blue's). Reviews reads
  # the `proof` artifact from GitHub: a release is proposed on a commit
  # whose proof is in, and that is the proof reviewed. Within the hour.
  proof:
    if: github.event_name == 'push'
    runs-on: [self-hosted, visor-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit before too: its kept pictures are what the screens are compared with.
          fetch-depth: 2
      - name: The phone app in a macOS VM, and the proof
        # exec: the runner's cancel reaches the script's trap, which releases the VM.
        run: exec tools/ci/mac_vm_proof.sh --kind full --base HEAD^ --proof "$RUNNER_TEMP/proof"
      # The proof whether the screens came up or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  pins:
    if: github.event_name == 'push'
    runs-on: [self-hosted, visor-ci]
    steps:
      - uses: actions/checkout@v4
      - run: tools/released_pins.sh

  # The version this commit's build takes, and its proof is filed under:
  # MAJOR.MINOR.BUILD, BUILD one past the line's highest on the release
  # server (the plist says MAJOR.MINOR.0), kept there as the commit's.
  number:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: next
        run: echo "version=$($PIPELINE_CI number Visor applications/visor_ios/Info.plist)" >> "$GITHUB_OUTPUT"
        env:
          # The commit itself (a pull request's head, not its merge ref).
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The commit's packages (the iPhone's .ipa, the Mac's apps signed and
  # notarized) at that number, published to Releases as the pull request's
  # builds, or the version's on a pre-release branch (release-*) or main.
  # What is done with them is the runner's ($PIPELINE_CI). (On main the pull
  # request's values are empty, and it takes the push's own.)
  build:
    needs: number
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: $PIPELINE_CI prepare
      - run: $PIPELINE_CI stamp ${{ needs.number.outputs.version }} applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_macos/Info.plist applications/visor_menubar/Info.plist applications/visor_container_host/Info.plist
      - run: tools/build_packages.sh
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}

  # Visor's agent image (tools/containers/visor-agent), which sessions'
  # containers are made from: built on the release Mac (Apple's container)
  # and pushed to GitHub's registry as this build's version and its
  # MAJOR.MINOR (ghcr.io/attilathefun/visor-agent), which a Visor server of
  # that version asks its OS Server for.
  agent-image:
    needs: number
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: tools/containers/publish_agent_image.sh ${{ needs.number.outputs.version }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

  # The apps built on Linux where a session's agent builds them: in a
  # container of this build's own agent image, leased from the OS Server on
  # the runner's Mac (self-hosted, oss-container), the Apple apps with
  # rules_applecross from that server's files, the Linux client and blue
  # Visor's Android APK (tools/ci/container_build.sh).
  # A fork's pull request never runs there.
  container:
    needs: [number, agent-image]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, oss-container]
    timeout-minutes: 90
    # One build at a time on the runner's Mac.
    concurrency:
      group: visor-oss-container
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bazel run //tools/ci:container_build -- ghcr.io/attilathefun/visor-agent:${{ needs.number.outputs.version }}

  # Blue Visor (the client on Isomer: docs/isomer.md), its web client: built
  # optimized, its tests run, then checked in headless Chrome: the end-to-end
  # test against the stand-in server on its three roads, the transcript's
  # layout and the composer typed into. In a macOS VM leased from OS Server
  # (tools/ci/mac_vm_blue_web.sh), whose image has Chrome. Its Android APK
  # is built in the container job's build (tools/ci/container_build.sh).
  blue-web:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_blue_web.sh review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # Blue Visor on the iPhone: the WasmKit app and the one compiled against
  # Isomer's frameworks, for the simulator (no signing team needed), then
  # its fixture's screens in each orientation and the web client's in
  # Mobile Safari, against tests/snapshots. On the release Mac: GitHub's
  # hosted Mac minutes are billed. The harness makes its simulators and
  # removes them after.
  blue-ios:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build
        run: >
          bazel build -c opt --ios_multi_cpus=sim_arm64
          //applications/visor_isomer_ios
          //applications/visor_isomer_compiled_ios
      # Mobile Safari's simulator is this job's own, made new for the run and
      # deleted after it (the iPhone fixture's runner makes and deletes its
      # own), so it never meets the proof's or the releases runner's.
      - name: A fresh simulator for Mobile Safari
        run: |
          xcrun simctl list -j devices | python3 -c 'import json, sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"] == "blue-ci-web-mobile"]' |
            while read -r udid; do xcrun simctl shutdown "$udid" 2>/dev/null || true; xcrun simctl delete "$udid"; done
      - name: Snapshots
        run: python3 tools/isomer/snapshots/snapshots.py run --targets ios,ios-landscape,web-mobile
        env:
          VISOR_SNAPSHOT_RUN_DIR: ${{ runner.temp }}/blue-snapshots
          VISOR_SNAPSHOT_SIMULATOR: blue-ci-web-mobile
      - name: Delete Mobile Safari's simulator
        if: always()
        run: |
          xcrun simctl list -j devices | python3 -c 'import json, sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"] == "blue-ci-web-mobile"]' |
            while read -r udid; do xcrun simctl shutdown "$udid" 2>/dev/null || true; xcrun simctl delete "$udid"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-ios-snapshots
          path: ${{ runner.temp }}/blue-snapshots
          if-no-files-found: ignore
