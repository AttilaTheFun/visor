name: CI
# Visor's CI, as Reviews' policy for Logan's protected repositories has it
# (AttilaTheFun/reviews, docs/CI_POLICY.md; Logan, 7 Nov 2026), on GitHub's
# own standard runners and cache alone, as every public app repository's
# (Logan, 15 Nov 2026): nothing of Shireworks' at run time, no runner of
# its, no lease, no cache, no files, no signing service.
#
# Automated CI only builds (Logan, 7 Nov 2026), but for the client's
# screens: walked headless through Isomer's driver (FEATURE_MAP.md,
# //tests/feature_map_tests), they run before and after every merge
# (Logan, 15 Nov 2026).
#
# Each platform builds where its tools run (tools/ci/container_build.sh):
# Linux and Android on x86_64 `ubuntu-24.04` in Swift's image
# (tools/ci/job_tools.sh), the Apple targets on `xcode-27` Macs: a
# proposal's and a release's Apple apps with rules_applecross's Swift
# toolchain there (swift.org's Swift 6.4.2, the Mac's Xcode 27.2 for the
# SDKs and bundling: .bazelrc's apple_cross_mac), never Xcode's own Swift,
# whose build of 0.62.1 aborted at launch on macOS 27.0
# (docs/DEVELOPMENT.md, "Release builds"); each is opened for real on an
# `xcode-27` Mac, signed, before it is proposed or attached
# (tools/ci/launch_check). Bazel's
# caches: GitHub's (.github/actions/bazel_cache), written by main's builds
# alone, and BuildBuddy's, its key (BUILDBUDDY_API_KEY) handed only to
# main's builds and the alpha and release jobs (tools/ci/ci_bazel.sh).
# docs/DEVELOPMENT.md, "CI", has the whole.
#
# - A pull request runs `container`, the required check (Linux: the rules,
#   the Linux client and blue Visor's Android APK built, the client's
#   screens walked headless, the command-line server built with SwiftPM),
#   and `container-apple` beside it (the iPhone and Mac apps, the Mac's
#   test bundles, libraries and servers, built). A pull request of
#   documentation alone checks the rules and stops there. A newer push
#   cancels its run. A fork's pull request runs them too, on GitHub's
#   runners: no secret reaches it, and it writes no cache.
# - Each commit on main runs `populate` and `populate-apple`: the merged
#   tree built as the pull request's jobs build it, and its screens walked
#   headless (nothing published), into GitHub's cache and BuildBuddy's.
# - By hand (workflow_dispatch on main, `run`): `verify` (the tests and
#   the proof, its last job `verify` keeping the `proof` artifact),
#   `prerelease` (Alphas built, signed in alpha with the environment
#   `release`'s keys, tools/ci/sign_builds.sh, the Mac's launched
#   (alpha-launch), and a draft pre-release: alpha-propose),
#   `release` (verify and pins first, then as prerelease, a draft release),
#   `agent-image` (Visor's toolchain image).
# - A published release (Logan's Release in Reviews): Production built from
#   the tag (`--config=prod`: release-apple, release-android), then
#   release checks it is a verified main commit and signs them,
#   release-launch opens the signed Mac app, and release-assets attaches
#   them. Android never holds Apple's back.
#
# The signing keys (the environment `release`: main and v* tags) reach the
# Sign steps of alpha and release alone; no other job names the
# environment. The screenshot proof never runs on a push or a pull request:
# only in a run by hand (verify, release).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: "verify: the tests and the proof. prerelease: Alphas and a draft pre-release. release: verify, then Alphas and a draft release. agent-image: Visor's toolchain image, built and pushed."
        type: choice
        options: [verify, prerelease, release, agent-image]
        default: verify
  # Logan's Release in Reviews publishes the draft, which makes its v* tag.
  release:
    types: [published]
concurrency:
  # A pull request's newer push cancels its older run. Every other run (main's
  # populate, a run by hand, a release) is a group of its own and never
  # cancelled, so a publish is never cut off halfway.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.head_ref)
        || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
# Every step in bash with pipefail (GitHub's `bash --noprofile --norc -eo
# pipefail {0}`): its default, `bash -e {0}`, takes a pipe's last status, so
# a failing command piped into tee or grep would pass.
defaults:
  run:
    shell: bash
# Visor for Android's release certificate (SHA-256): the APK signed with the
# key in the GitHub environment `release`'s secrets (alpha's and release's
# Sign steps) must carry it (tools/ci/android_sign.sh), so a key that isn't
# Visor's signs nothing.
env:
  VISOR_ANDROID_PIN: 779E6428CC219033DA3A0086DAB3CE21F8D3D35806E4199E8BAC7D58D86B18A5
jobs:
  # ---- Pull requests -------------------------------------------------------

  # Linux: Swift's image (6.4.0, by digest) on x86_64 Ubuntu, Bazel's tree
  # on the runner's second disk.
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # Whether it changes anything but documentation (docs/, .notes/,
      # Markdown).
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # The rules of AGENTS.md that must hold (tools/check_rules.py), its
      # commits without attribution lines among them.
      - name: Rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_rules.py --commits "$BASE..HEAD"
      # GitHub's cache alone, read: no BuildBuddy key reaches a pull request.
      - uses: ./.github/actions/bazel_cache
        if: steps.changes.outputs.code == 'true'
        with:
          group: ubuntu
      # The Linux client and blue Visor's Android APK
      # (tools/ci/container_build.sh builds where it runs).
      - name: The apps
        if: steps.changes.outputs.code == 'true'
        run: tools/ci/container_build.sh
      # The client's screens, walked headless through Isomer's driver
      # (FEATURE_MAP.md; the client in fixture mode, nothing drawn).
      - name: The client's screens, headless
        if: steps.changes.outputs.code == 'true'
        run: bazel test --config=headless --test_output=errors //tests/feature_map_tests/...
      # SwiftPM's copy of the client link's Swift (libraries/visor_client_proto/
      # Sources) is what the protos make (tools/proto/generate, with Bazel's
      # protoc and plugins).
      - name: The protos' Swift
        if: steps.changes.outputs.code == 'true'
        run: bazel run //tools/proto:generate -- --check
      # Bazel's server let go before SwiftPM builds beside it.
      - name: Bazel stopped
        if: steps.changes.outputs.code == 'true'
        run: bazel shutdown || true
      # The command-line server with SwiftPM, and the client's host services
      # on their own (a file that uses Foundation without importing it fails
      # here, as in Visor on Isomer). Its tests are verify's (linux).
      - name: The command-line server on Linux
        if: steps.changes.outputs.code == 'true'
        run: |
          swift build --product visor-server
          swift build --target VisorServices
          swift build --target VisorClientGRPCServer
          swift build --target VisorClientGRPCClient

  # The Apple targets, on an xcode-27 Mac with its own Xcode.
  container-apple:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/bazel_cache
        if: steps.changes.outputs.code == 'true'
        with:
          group: apple
      # The iPhone and iPad app, Visor.app, the Mac client and Visor Server,
      # the Mac's test bundles, then the libraries and servers for the Mac.
      - name: The Apple apps
        if: steps.changes.outputs.code == 'true'
        run: tools/ci/container_build.sh

  # ---- main ----------------------------------------------------------------

  # What a pull request's jobs build, for main's merged tree, into GitHub's
  # cache (its one writer) and BuildBuddy's, so the next pull request's
  # build is mostly cache hits; and the client's screens walked headless, as
  # container does. Nothing published.
  populate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: The apps
        run: tools/ci/container_build.sh
      - name: The client's screens, headless
        run: bazel test --config=headless --test_output=errors //tests/feature_map_tests/...
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: ubuntu
          gigabytes: 5
          repository-hit: ${{ steps.cache.outputs.repository-hit }}

  populate-apple:
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: The Apple apps
        run: tools/ci/container_build.sh
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: apple
          gigabytes: 3
          repository-hit: ${{ steps.cache.outputs.repository-hit }}

  # ---- By hand: verify -----------------------------------------------------

  # The tests that need a Mac (the server's Apple side, the client, its
  # views, SSH): their .xctest bundles built (tools/ci/build_mac_tests.sh)
  # and run (tools/ci/mac_tests_run.sh: `xcrun xctest`, Xcode 27.2) on an
  # xcode-27 Mac.
  test:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
      - name: The test bundles
        run: tools/ci/build_mac_tests.sh "$RUNNER_TEMP/mac-tests.tar.gz"
      - name: The tests
        run: tools/ci/mac_tests_run.sh "$RUNNER_TEMP/mac-tests.tar.gz" --logs "$RUNNER_TEMP/test-logs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs

  # The proof's apps: the iPhone app for Apple silicon's simulator, and
  # Visor.app (signed ad hoc), with Isomer's driver in them (--config=drive:
  # the proof's builds alone, never a release's), on an xcode-27 Mac.
  build-apple:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh \
            --config=drive --macos_cpus=arm64 --ios_multi_cpus=sim_arm64 \
            //applications/visor_ios //applications/visor_mac //applications/visor_macos
      - uses: actions/upload-artifact@v4
        with:
          name: apps-ios
          path: .ci/proof-apps/visor_ios.ipa
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: apps-mac
          path: |
            .ci/proof-apps/visor_mac.zip
            .ci/proof-apps/visor_macos.zip
          if-no-files-found: error
          retention-days: 1

  # Blue Visor's APK for x86_64, which GitHub's emulator is, with Isomer's
  # driver in it (--config=drive, as build-apple's).
  build-android:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 60
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh \
            --config=drive --compilation_mode=opt --android_platforms=@rules_android//:x86_64 \
            //applications/visor_android:visor_android_apk
      - uses: actions/upload-artifact@v4
        with:
          name: apps-android
          path: .ci/proof-apps/*.apk
          if-no-files-found: error
          retention-days: 1

  # The release's proof is five jobs side by side: the iPhone and Android,
  # each upright and on its side, and the Mac. The iPhone's and Android's
  # walk FEATURE_MAP.md through Isomer's driver
  # (//tests/feature_map_tests:feature_map_proof_<platform>, built here by
  # Bazel while the simulator or emulator boots, its cache in GitHub's),
  # picturing each of the fixture's screens; the Mac's opens them one by
  # one. The iPhone app's UI cases are not in it (since 12 Nov 2026):
  # tools/ios_ui_tests.sh runs them.
  #
  # The iPhone app's fixture screens, in one orientation, on an iPhone 17
  # simulator (tools/ci/proof_ios.sh).
  #
  # It starts with the run, not after build-apple: the simulator boots (five
  # minutes of the job) and the driver's test builds while the apps build,
  # and the script waits for their artifact once it is up
  # (tools/ci/await_artifact.sh).
  proof-ios:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: xcode-27
    # A cold build of the driver's test (Isomer and its Swift packages) on a
    # 3-core runner takes longer than 45 minutes; a warm one about 10.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v5
      # The driver's test's build, kept between runs (GitHub's cache: a
      # public repository's, as Logan's 15 Nov rule has it). Restored here
      # and saved at the end whatever the run's outcome, so a build cut off
      # by the timeout still leaves what it built for the next run.
      - id: proof-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/visor-proof-bazel
          key: proof-ios-${{ matrix.orientation }}-${{ hashFiles('MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            proof-ios-${{ matrix.orientation }}-${{ hashFiles('MODULE.bazel.lock') }}-
            proof-ios-${{ hashFiles('MODULE.bazel.lock') }}-
      - run: |
          echo "common --disk_cache=$HOME/.cache/visor-proof-bazel/disk" >> ~/.bazelrc
          echo "common --repository_cache=$HOME/.cache/visor-proof-bazel/repository" >> ~/.bazelrc
      - run: tools/ci/proof_ios.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part" "${{ matrix.orientation }}"
        env:
          PROOF_APPS_ARTIFACT: apps-ios
          PROOF_APPS_JOB: build-apple
          GH_TOKEN: ${{ github.token }}
      # The part whether its screens came up or not: a broken screen is what
      # the proof is for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-ios${{ matrix.orientation == 'landscape' && '-landscape' || '' }}
          path: ${{ runner.temp }}/part
          retention-days: 1
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.proof-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/visor-proof-bazel
          key: proof-ios-${{ matrix.orientation }}-${{ hashFiles('MODULE.bazel.lock') }}-${{ github.sha }}

  # Visor.app's fixture screens (tools/ci/proof_mac.sh).
  proof-mac:
    needs: build-apple
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apps-mac
          path: ${{ runner.temp }}/apps
      - run: tools/ci/proof_mac.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part"
      # Visor Client (applications/visor_macos), ad hoc: opens sandboxed,
      # its container made (docs/visor-client.md).
      - run: tools/ci/mac_app_opens.sh --ad-hoc --sandboxed "$RUNNER_TEMP/apps/visor_macos.zip"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-mac
          path: ${{ runner.temp }}/part
          retention-days: 1

  # Blue Visor's screens, in one orientation, on an Android emulator under
  # Ubuntu's KVM (tools/ci/proof_android.sh), through the driver as
  # proof-ios's.
  proof-android:
    # With the run, as proof-ios: the emulator boots and the driver's test
    # builds while the APK builds.
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/visor-proof-bazel
          key: proof-android-${{ hashFiles('MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: proof-android-${{ hashFiles('MODULE.bazel.lock') }}-
      - run: |
          echo "common --disk_cache=$HOME/.cache/visor-proof-bazel/disk" >> ~/.bazelrc
          echo "common --repository_cache=$HOME/.cache/visor-proof-bazel/repository" >> ~/.bazelrc
      - run: tools/ci/proof_android.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part" "${{ matrix.orientation }}"
        env:
          PROOF_APPS_ARTIFACT: apps-android
          PROOF_APPS_JOB: build-android
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-android${{ matrix.orientation == 'landscape' && '-landscape' || '' }}
          path: ${{ runner.temp }}/part
          retention-days: 1

  # Linux: Bazel's swift_test targets (//tests:linux), the client's screens
  # walked headless, then the command-line server with SwiftPM, built, its
  # tests run, and the server tried, a throwaway session over its WebSocket
  # (tools/ci/linux_tests.sh, with Node 22 for the probe).
  linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 90
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
      - name: The tests
        run: bazel test --test_output=errors //tests:linux
      - name: The client's screens, headless
        run: bazel test --config=headless --test_output=errors //tests/feature_map_tests/...
      # Bazel's server let go before SwiftPM builds beside it.
      - run: bazel shutdown || true
      - run: tools/ci/linux_tests.sh

  # Blue Visor's web client (docs/isomer.md), built optimized
  # (tools/ci/container_blue_web.sh --build-only). Until the Mac Studio
  # nothing runs it: without --build-only the script goes on to its tests and
  # the end-to-end test in headless Chromium.
  blue-web:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 60
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
      - run: tools/ci/container_blue_web.sh review --build-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # The proof, from what the platforms pictured: each screen an item under
  # a stable id, in proof.zip (tools/ci/proof_make.sh; AttilaTheFun/reviews'
  # docs/PROOF_FORMAT.md, format 2), kept as the `proof` artifact. Nothing is
  # compared here: Reviews compares it with the prior release's, item by item
  # (Logan, 8 Nov 2026). It passes only when the Mac's tests, Linux's, the
  # web client and every platform's part did: its success is the commit
  # verified, which a release's alpha and the release job ask for
  # (tools/ci/verified_run.sh, by this job's name).
  verify:
    needs: [test, linux, blue-web, build-apple, build-android, proof-ios, proof-mac, proof-android]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
      - run: tools/ci/proof_make.sh "$RUNNER_TEMP/parts" "$RUNNER_TEMP/proof"
      # The proof's comparison with the prior release's, made once and kept
      # beside proof.json (proof-diff.json; AttilaTheFun/reviews'
      # docs/PROOF_FORMAT.md): Reviews shows it at once. Never fails the job.
      - name: The proof's comparison
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/proof/proof/proof.json" ] || exit 0
          python3 -I tools/ci/proof_diff.py make "$RUNNER_TEMP/proof/proof" || echo "::warning::the proof's comparison wasn't made"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          # proof.json and its files: GitHub zips them, so the artifact's
          # download is the proof as the release keeps it (proof.zip).
          path: ${{ runner.temp }}/proof/proof
          if-no-files-found: error
          retention-days: 1
      - if: needs.test.result != 'success' || needs.linux.result != 'success' || needs.blue-web.result != 'success' || needs.proof-ios.result != 'success' || needs.proof-mac.result != 'success' || needs.proof-android.result != 'success'
        run: |
          echo "::error::Not verified: the Mac's tests $TESTS, Linux's $LINUX, the web client $WEB, iPhone $IOS, Mac $MAC, Android $ANDROID"
          exit 1
        env:
          TESTS: ${{ needs.test.result }}
          LINUX: ${{ needs.linux.result }}
          WEB: ${{ needs.blue-web.result }}
          IOS: ${{ needs.proof-ios.result }}
          MAC: ${{ needs.proof-mac.result }}
          ANDROID: ${{ needs.proof-android.result }}

  # ---- By hand: proposals --------------------------------------------------

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). A release's alone: a pre-release may still pin
  # a revision.
  pins:
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: tools/released_pins.sh

  # Visor's own Linux programs (tools/linux_programs.sh: visor-server, also
  # the agents' host, linked fully static for arm64 with Swift's Static
  # Linux SDK), which the signing job seals into Visor.app for the
  # containers it makes: built on GitHub's arm64 Ubuntu, in Visor's agent
  # image (0.58, by digest: the Swift 6.4.0 the SDK is for), which checks
  # both programs run, and handed over as a tar
  # (tools/ci/linux_programs.sh). It needs no version, so it runs beside
  # verify, and for a release beside its builds.
  linux-programs:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       (inputs.run == 'prerelease' || inputs.run == 'release')) ||
      (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/attilathefun/visor-agent@sha256:092ad17868052d61f8958d432499a494cbfd61769b4ffc46456a2e849f15a152
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: tools/ci/linux_programs.sh "$RUNNER_TEMP/linux-programs.tar"
      - run: tar -tvf "$RUNNER_TEMP/linux-programs.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs.tar
          retention-days: 1

  # The proposal's Apple builds (prerelease, or release once verify and
  # pins passed), on main, on an xcode-27 Mac: its version from the
  # repository's releases and tags (tools/ci/version_from_tags.sh), the
  # iPhone app (--config=ci_device) and Visor.app, optimized, for alpha to
  # sign. Built with rules_applecross's Swift toolchain (.bazelrc's
  # apple_cross_mac: swift.org's Swift 6.4.2 and LLVM's ld64.lld, the Mac's
  # Xcode 27.2 for the SDKs, actool, ibtool and macros), not with Xcode's
  # own Swift, whose 0.62.1 aborted at launch on macOS 27.0
  # (docs/DEVELOPMENT.md, "Release builds").
  alpha-apple:
    needs: [verify, pins]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.run == 'prerelease' ||
       (inputs.run == 'release' && needs.verify.result == 'success' && needs.pins.result == 'success'))
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      # The releases' drafts, which the version is counted from.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # 0.N.M, the next of the committed line after every release and tag on
      # it (the same again for the same commit), stamped into the checkout's
      # Info.plists and never committed. No version is no proposal.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci/version_from_tags.sh applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_mac/Info.plist applications/visor_disk_utility/Info.plist applications/visor_macos/Info.plist
          version="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          case "$version" in
            "" | *.0) echo "::error::no build version was stamped (the plist says \"$version\")"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Logan's line rule (8 Nov 2026): no proposal on a line already
      # published as a production release, so a release ends its line
      # (tools/ci/check_version_line.sh, AttilaTheFun/applications').
      - name: A line not yet released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/ci/check_version_line.sh "$VERSION"
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      # The app group shared with Applications, and Applications' bundle ids
      # on a Mac (UpdateKit; tools/signing), from the repository's secrets,
      # so neither the public source nor a log names them. A build published
      # without the group would never check for updates, so none is made.
      # After Bazel's settings, which write .bazelrc.user afresh.
      - name: Update settings
        env:
          UPDATE_APP_GROUP: ${{ secrets.VISOR_UPDATE_APP_GROUP }}
          UPDATE_APPLICATIONS_BUNDLE_IDS: ${{ secrets.VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS }}
          # The team Visor Disk Utility's root check pins its copy to,
          # compiled in (tools/signing's TEAM_ID; never in the repository):
          # an optimized build without it refuses Swap In and unswap.
          VISOR_TEAM_ID: ${{ vars.VISOR_TEAM_ID }}
        run: |
          if [ -z "$UPDATE_APP_GROUP" ] || [ -z "$UPDATE_APPLICATIONS_BUNDLE_IDS" ]; then
            echo "::error::No VISOR_UPDATE_APP_GROUP or VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS secret: a build published without them never checks for updates"
            exit 1
          fi
          if [ -z "$VISOR_TEAM_ID" ]; then
            echo "::error::No VISOR_TEAM_ID variable: Visor Disk Utility built without its team refuses Swap In and unswap"
            exit 1
          fi
          printf 'common --repo_env=VISOR_UPDATE_APP_GROUP=%s\ncommon --repo_env=VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS=%s\n' \
            "$UPDATE_APP_GROUP" "$UPDATE_APPLICATIONS_BUNDLE_IDS" >> .bazelrc.user
          printf 'common --repo_env=VISOR_TEAM_ID=%s\n' "$VISOR_TEAM_ID" >> .bazelrc.user
          # No build event stream to BuildBuddy here: it would carry these
          # options. Its remote cache stays.
          echo 'common --bes_backend=' >> .bazelrc.user
      # The sign-in Logan's apps share (ShakeKit's GitHubShared… keys and
      # its keychain group, tools/shared_sign_in): the shared OAuth App's
      # client id, from the repository's secrets, so neither the public
      # source nor a log names it; its keychain group's team is VISOR_TEAM_ID
      # (tools/team_id). Without it the build's ShakeKit, whose only sign-in
      # this is, reports nothing. After Update settings, whose app group
      # holds its lock; before the build, with BuildBuddy's event stream
      # already off.
      - name: Shared sign-in settings
        env:
          SHARED_CLIENT_ID: ${{ secrets.VISOR_GITHUB_SHARED_CLIENT_ID }}
        run: |
          if [ -z "$SHARED_CLIENT_ID" ]; then
            echo "::warning::No VISOR_GITHUB_SHARED_CLIENT_ID secret: this build's ShakeKit has no sign-in, so it reports nothing"
            exit 0
          fi
          printf 'common --repo_env=VISOR_GITHUB_SHARED_CLIENT_ID=%s\n' "$SHARED_CLIENT_ID" >> .bazelrc.user
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
        run: >-
          tools/ci/container_build.sh --config=alpha --config=ci_device --compilation_mode=opt
          --config=apple_cross_mac //applications/visor_ios //applications/visor_mac //applications/visor_disk_utility
          //applications/visor_macos
      # The signing keeps the entitlements its signature carries: built
      # unsigned, it would lose the microphone.
      - name: Visor.app signed ad hoc with its entitlements
        run: tools/ci/mac_app_signed.sh .ci/packages/visor_mac.zip com.apple.security.device.audio-input com.apple.developer.aps-environment keychain-access-groups
      # Visor Client, sandboxed (docs/visor-client.md), likewise.
      - name: Visor Client signed ad hoc with its entitlements
        run: >-
          tools/ci/mac_app_signed.sh .ci/packages/visor_macos.zip com.apple.security.app-sandbox
          com.apple.security.network.client com.apple.security.device.audio-input
          com.apple.security.files.user-selected.read-only com.apple.developer.aps-environment keychain-access-groups
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-apple
          path: |
            .ci/packages/*.ipa
            .ci/packages/visor_mac.zip
            .ci/packages/visor_disk_utility.zip
            .ci/packages/visor_macos.zip
          if-no-files-found: error
          retention-days: 1

  # The proposal's builds: Visor for Android with the same version
  # (tools/ci/stamp_android.sh), Visor.app given Visor's Linux programs, and
  # every build signed in the Sign step, the one the environment `release`'s
  # keys reach (tools/ci/sign_builds.sh), handed to alpha-launch and
  # alpha-propose.
  alpha:
    needs: [alpha-apple, linux-programs]
    if: ${{ !cancelled() && needs.alpha-apple.result == 'success' && needs.linux-programs.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      # Into a folder of its own (container_build.sh empties the one it is
      # given).
      - name: Build Android
        env:
          VISOR_CI_PACKAGE: .ci/android
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: |
          tools/ci/stamp_android.sh "$VERSION"
          tools/ci/container_build.sh --config=alpha --compilation_mode=opt //applications/visor_android:visor_android_apk
      - uses: actions/download-artifact@v4
        with:
          name: alpha-apple
          path: .ci/packages
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - name: Visor's Linux programs into Visor.app
        run: |
          bazel run //tools/container_manifest -- --workflow .github/workflows/ci.yml --out "$RUNNER_TEMP/container.json"
          tools/ci/mac_app_linux_programs.sh .ci/packages/visor_mac.zip "$RUNNER_TEMP/linux-programs/linux-programs.tar" "$RUNNER_TEMP/container.json"
      # The keys reach this step alone. Each build signed, and saved for the
      # draft with builds.json: Visor-<version>-ios.ipa, -macos.zip and
      # -android.apk.
      - name: Sign
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
        run: >-
          tools/ci/sign_builds.sh --variant Alpha --out "$RUNNER_TEMP/assets"
          --ipa-kind development --android-pin "$VISOR_ANDROID_PIN"
          .ci/packages/*.ipa .ci/packages/visor_mac.zip .ci/packages/visor_disk_utility.zip .ci/packages/visor_macos.zip
          .ci/android/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 1

  # The signed Visor.app opened for real on an `xcode-27` Mac (macOS 27, as
  # the Macs it ships to), its server answering and the app still up a
  # minute later (tools/ci/launch_check), before anything is proposed: the
  # proofs run the client in fixture mode, with no server, and passed
  # 0.62.1, which aborted at launch.
  alpha-launch:
    needs: alpha
    if: ${{ !cancelled() && needs.alpha.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: alpha-assets
          path: ${{ runner.temp }}/assets
      - run: bazel run //tools/ci/launch_check -- "$RUNNER_TEMP"/assets/Visor-[0-9]*-macos.zip
      # Visor Disk Utility: signed, notarized, accepted by Gatekeeper, and opens.
      - run: tools/ci/mac_app_opens.sh "$RUNNER_TEMP"/assets/Visor-Disk-Utility-*-macos.zip
      # Visor Client: the same, and sandboxed, its container made.
      - run: tools/ci/mac_app_opens.sh --sandboxed "$RUNNER_TEMP"/assets/Visor-Client-*-macos.zip

  # The draft release (tools/ci/propose_release.sh) and its assets
  # (tools/ci/attach_release.sh), what Applications lists
  # (AttilaTheFun/applications' docs/RELEASE_ASSETS.md), once the Mac app
  # launched.
  alpha-propose:
    needs: [alpha-apple, alpha, alpha-launch]
    if: ${{ !cancelled() && needs.alpha.result == 'success' && needs.alpha-launch.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The draft release (and the drafts it is found among).
      contents: write
      # This run's artifacts (the builds, the proof).
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: alpha-assets
          path: ${{ runner.temp }}/assets
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.run }}
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: tools/ci/propose_release.sh "$KIND" "$VERSION" "$RUNNER_TEMP/assets/builds.json"
      # A release's proposal: the proof verify made of this commit, saying
      # the version, among the assets, so the draft and the release keep it
      # (AttilaTheFun/reviews' docs/PROOF_FORMAT.md).
      - uses: actions/download-artifact@v4
        if: inputs.run == 'release'
        with:
          name: proof
          path: ${{ runner.temp }}/proof
      - name: The proof among the assets
        if: inputs.run == 'release'
        env:
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: |
          tools/ci/proof_version.sh "$RUNNER_TEMP/proof" "$VERSION" "$RUNNER_TEMP/assets/proof.zip"
          if [ -f "$RUNNER_TEMP/proof/proof-diff.json" ]; then cp "$RUNNER_TEMP/proof/proof-diff.json" "$RUNNER_TEMP/assets/"; fi
      # The Alphas on the draft: Visor-<version>-ios.ipa, -macos.zip,
      # -android.apk and builds.json, which Applications reads (and a
      # release's proof.zip).
      - name: The builds on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: tools/ci/attach_release.sh "v$VERSION" "$RUNNER_TEMP/assets"

  # Visor's toolchain image (tools/containers/visor-agent/Dockerfile's build
  # target, ghcr.io/attilathefun/visor-agent), which Shireworks' primary
  # container runs, as do CI's linux-programs job and Isomer's CI: whether
  # it is to be built, by hand (`run: agent-image`), or in a release whose
  # tools/containers/ changed since the release before it. Not in every
  # release: it changes rarely.
  agent-image-wanted:
    needs: [alpha-apple, alpha-propose]
    if: ${{ !cancelled() && (inputs.run == 'agent-image' || needs.alpha-propose.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.changed.outputs.build }}
      version: ${{ steps.changed.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: changed
        env:
          RUN: ${{ inputs.run }}
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2> /dev/null || true)"
          # By hand, between releases: the last release's version and this
          # commit, so its tags (0.56.1, 0.56) keep their image.
          echo "version=${VERSION:-${previous#v}-$(git rev-parse --short=7 HEAD)}" >> "$GITHUB_OUTPUT"
          if [ "$RUN" = agent-image ] || [ -z "$previous" ] || ! git diff --quiet "$previous" HEAD -- tools/containers; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "tools/containers/ hasn't changed since $previous: the image stays as it is"
          fi

  # The image, when wanted, built with buildah as root on GitHub's arm64
  # Ubuntu (arm64 alone, as the containers that run it: no emulated
  # architecture) and pushed to GitHub's registry as that version, its
  # MAJOR.MINOR and latest (tools/containers/publish_agent_image.sh).
  agent-image:
    needs: [alpha-propose, agent-image-wanted]
    if: ${{ !cancelled() && needs.agent-image-wanted.outputs.build == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: sudo --preserve-env=GHCR_USER,GHCR_TOKEN,VISOR_REF tools/containers/publish_agent_image.sh "$VERSION"
        env:
          VERSION: ${{ needs.agent-image-wanted.outputs.version }}
          VISOR_REF: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

  # ---- Released ------------------------------------------------------------

  # Production, when Logan releases a proposed release in Reviews (never a
  # pre-release), built from the tag's commit with --config=prod and the
  # tag's version (not the Alphas stamped again): release-apple and
  # release-android (Apple's with rules_applecross's Swift on an xcode-27
  # Mac, as alpha-apple's). release checks it is a verified main commit and signs
  # them in its Sign step, release-launch opens the signed Visor.app, and
  # release-assets attaches them. Android never holds Apple's back
  # (tools/ci/promote_release.sh): Apple's are signed whatever
  # release-android's result, and release-android-result fails the run
  # afterwards; re-running the failed jobs signs the APK alone.
  release-apple:
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v')
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # The tag's version, found as the proposal found it (the release made
      # at this commit), and checked against the tag.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tools/ci/version_from_tags.sh applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_mac/Info.plist applications/visor_disk_utility/Info.plist applications/visor_macos/Info.plist
          version="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          [ "v$version" = "$TAG" ] || { echo "::error::the version stamped, $version, isn't $TAG's"; exit 1; }
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Update settings
        env:
          UPDATE_APP_GROUP: ${{ secrets.VISOR_UPDATE_APP_GROUP }}
          UPDATE_APPLICATIONS_BUNDLE_IDS: ${{ secrets.VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS }}
          # The team Visor Disk Utility's root check pins its copy to,
          # compiled in (tools/signing's TEAM_ID; never in the repository):
          # an optimized build without it refuses Swap In and unswap.
          VISOR_TEAM_ID: ${{ vars.VISOR_TEAM_ID }}
        run: |
          if [ -z "$UPDATE_APP_GROUP" ] || [ -z "$UPDATE_APPLICATIONS_BUNDLE_IDS" ]; then
            echo "::error::No VISOR_UPDATE_APP_GROUP or VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS secret: a build published without them never checks for updates"
            exit 1
          fi
          if [ -z "$VISOR_TEAM_ID" ]; then
            echo "::error::No VISOR_TEAM_ID variable: Visor Disk Utility built without its team refuses Swap In and unswap"
            exit 1
          fi
          printf 'common --repo_env=VISOR_UPDATE_APP_GROUP=%s\ncommon --repo_env=VISOR_UPDATE_APPLICATIONS_BUNDLE_IDS=%s\n' \
            "$UPDATE_APP_GROUP" "$UPDATE_APPLICATIONS_BUNDLE_IDS" >> .bazelrc.user
          printf 'common --repo_env=VISOR_TEAM_ID=%s\n' "$VISOR_TEAM_ID" >> .bazelrc.user
          # No build event stream to BuildBuddy here: it would carry these
          # options. Its remote cache stays.
          echo 'common --bes_backend=' >> .bazelrc.user
      # The sign-in Logan's apps share (ShakeKit's GitHubShared… keys and
      # its keychain group, tools/shared_sign_in): the shared OAuth App's
      # client id, from the repository's secrets, so neither the public
      # source nor a log names it; its keychain group's team is VISOR_TEAM_ID
      # (tools/team_id). Without it the build's ShakeKit, whose only sign-in
      # this is, reports nothing. After Update settings, whose app group
      # holds its lock; before the build, with BuildBuddy's event stream
      # already off.
      - name: Shared sign-in settings
        env:
          SHARED_CLIENT_ID: ${{ secrets.VISOR_GITHUB_SHARED_CLIENT_ID }}
        run: |
          if [ -z "$SHARED_CLIENT_ID" ]; then
            echo "::warning::No VISOR_GITHUB_SHARED_CLIENT_ID secret: this build's ShakeKit has no sign-in, so it reports nothing"
            exit 0
          fi
          printf 'common --repo_env=VISOR_GITHUB_SHARED_CLIENT_ID=%s\n' "$SHARED_CLIENT_ID" >> .bazelrc.user
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
        run: >-
          tools/ci/container_build.sh --config=prod --config=ci_device --compilation_mode=opt
          --config=apple_cross_mac //applications/visor_ios //applications/visor_mac //applications/visor_disk_utility
          //applications/visor_macos
      - name: Visor.app signed ad hoc with its entitlements
        run: tools/ci/mac_app_signed.sh .ci/packages/visor_mac.zip com.apple.security.device.audio-input com.apple.developer.aps-environment keychain-access-groups
      # Visor Client, sandboxed (docs/visor-client.md), likewise.
      - name: Visor Client signed ad hoc with its entitlements
        run: >-
          tools/ci/mac_app_signed.sh .ci/packages/visor_macos.zip com.apple.security.app-sandbox
          com.apple.security.network.client com.apple.security.device.audio-input
          com.apple.security.files.user-selected.read-only com.apple.developer.aps-environment keychain-access-groups
      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: |
            .ci/packages/*.ipa
            .ci/packages/visor_mac.zip
            .ci/packages/visor_disk_utility.zip
            .ci/packages/visor_macos.zip
          if-no-files-found: error
          retention-days: 1

  # A release's Android app, built for production (--config=prod) from the
  # tag's commit with the tag's version, as AttilaTheFun/reviews' release
  # does; signed by the release job.
  release-android:
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/android
          TAG: ${{ github.ref_name }}
        run: |
          tools/ci/stamp_android.sh "${TAG#v}"
          tools/ci/container_build.sh --config=prod --compilation_mode=opt //applications/visor_android:visor_android_apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: .ci/android/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [release-apple, release-android, linux-programs]
    if: >-
      ${{ !cancelled() && github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v') &&
      needs.release-apple.result == 'success' && needs.linux-programs.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.verified.outputs.run }}
    env:
      VISOR_BAZEL_ROOT: /mnt/bazel
    steps:
      # The release's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # A release is a main commit: a tag on any other stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      - name: The release was verified
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        # An assignment, so that the script's failure fails the step.
        run: |
          run="$(tools/ci/verified_run.sh "$(git rev-parse HEAD)")" \
            || { echo "::error::$GITHUB_REF_NAME's commit was not verified: nothing signed"; exit 1; }
          echo "Verified by run $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-apple
          path: ${{ runner.temp }}/apple
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Visor's Linux programs into Visor.app
        run: |
          bazel run //tools/container_manifest -- --workflow .github/workflows/ci.yml --out "$RUNNER_TEMP/container.json"
          tools/ci/mac_app_linux_programs.sh "$RUNNER_TEMP/apple/visor_mac.zip" "$RUNNER_TEMP/linux-programs/linux-programs.tar" "$RUNNER_TEMP/container.json"
      # Visor for Android, when release-android built it.
      - if: needs.release-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: ${{ runner.temp }}/android
      # The JDK and build tools the APK is signed with, by Bazel.
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      # What to sign: Apple's (unless a run before signed them) and the APK
      # if there is one.
      - name: The builds to sign
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/promote_release.sh plan "$GITHUB_REF_NAME" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/apple" "$RUNNER_TEMP/android"
      # The keys reach this step alone.
      - name: Sign
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
        run: |
          mapfile -t packages < "$RUNNER_TEMP/plan/packages"
          if [ ${#packages[@]} -gt 0 ]; then
            exec tools/ci/sign_builds.sh --variant Production --out "$RUNNER_TEMP/assets" \
              --ipa-kind production --dmg --android-pin "$VISOR_ANDROID_PIN" "${packages[@]}"
          fi
      - name: builds.json
        run: tools/ci/promote_release.sh merge "$RUNNER_TEMP/plan" "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 1

  # The signed Visor.app opened for real on an `xcode-27` Mac, as
  # alpha-launch opens a proposal's, before release-assets attaches it.
  # Not there when a run before signed Apple's and this one the APK alone
  # (tools/ci/promote_release.sh): that run launched it.
  release-launch:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - run: |
          for app in "$RUNNER_TEMP"/assets/Visor-[0-9]*-macos.zip; do
            [ -e "$app" ] || { echo "No Visor.app signed in this run: launched by the run that signed it"; exit 0; }
            bazel run //tools/ci/launch_check -- "$app"
          done
      - run: |
          for app in "$RUNNER_TEMP"/assets/Visor-Disk-Utility-*-macos.zip; do
            [ -e "$app" ] || { echo "No Visor Disk Utility signed in this run: checked by the run that signed it"; exit 0; }
            tools/ci/mac_app_opens.sh "$app"
          done
      - run: |
          for app in "$RUNNER_TEMP"/assets/Visor-Client-*-macos.zip; do
            [ -e "$app" ] || { echo "No Visor Client signed in this run: checked by the run that signed it"; exit 0; }
            tools/ci/mac_app_opens.sh --sandboxed "$app"
          done

  # Red when Visor for Android wasn't built and signed for this release,
  # once Apple's Production builds are attached (release-assets): Re-run
  # failed jobs then builds it again (release-android) and signs it alone
  # (release: Apple's, Production already, are left as they are), and
  # release-assets attaches only the APK and builds.json.
  release-android-result:
    needs: [release-android, release-assets]
    if: ${{ !cancelled() && github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Visor for Android released
        env:
          ANDROID: ${{ needs.release-android.result }}
          ASSETS: ${{ needs.release-assets.result }}
        run: |
          if [ "$ANDROID" != success ]; then
            echo "::error::release-android $ANDROID: this release has Apple's Production builds without Visor for Android. Re-run the failed jobs to build, sign and add it."
            exit 1
          fi
          [ "$ASSETS" = success ] || { echo "::error::release-assets $ASSETS"; exit 1; }

  # The release's Production builds among its files on GitHub, in place of
  # its Alphas under the same names (AttilaTheFun/applications'
  # docs/RELEASE_ASSETS.md): Visor-<version>-ios.ipa, -macos.zip,
  # -android.apk, the notarized -macos.dmg (Logan, 5 Nov 2026) and
  # builds.json, which Applications reads. Then the proof that verified it
  # (tools/ci/release_proof.sh), for the next release's to be compared
  # with. A job of its own, so that the one holding the signing keys
  # (release) keeps a read-only token.
  release-assets:
    needs: [release, release-launch]
    # release-android's failure (upstream, through release) doesn't skip it:
    # Apple's are attached whenever release signed them and Visor.app
    # launched.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release-launch.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - run: tools/ci/attach_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: tools/ci/release_proof.sh "$GITHUB_REF_NAME" --run "$VERIFIED"
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ needs.release.outputs.verified }}
