name: CI
# Every commit pushed to a pull request, and each one merged to main (a
# squash is a commit of its own): the fast checks, the tests and every
# platform's build; then, on the release Mac's runner (self-hosted,
# release-mac), the commit's packages built, signed and published to
# Releases. The proof (the simulator's screens and UI tests, recorded, and
# the Mac's screens) is not made here (GitHub's hosted Mac minutes are
# billed): an agent makes it on its own Mac or a test VM (tools/proof.sh)
# and publishes it to the review server tagged with the commit (releases:
# publish_proof). A newer push to the pull request cancels this run if it
# hasn't finished. main requires every job green on a pull request's head
# commit before it merges. A fork's pull request never runs on the release
# Mac.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # main's runs are never cut short: their builds are a release's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  test:
    # Xcode 27, the toolchain the code is written against.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Every target compiles in the Swift 6 mode with warnings as errors
      # (tools/swift), so building is a check of its own: the libraries,
      # the staging server and the apps' own code for the Mac, then the
      # views and the phone app's code for iOS. The app bundles themselves
      # need a signing team and are not built here.
      - name: Build (macOS)
        run: >
          bazel build
          //libraries/...
          //tools/staging_server
          //applications/visor_macos:macos_lib
          //applications/visor_menubar:menubar_lib
      - name: Build (iOS)
        run: >
          bazel build --platforms=@apple_support//platforms:ios_sim_arm64
          //libraries/visor_ui
          //applications/visor_ios:ios_lib
          //applications/visor_ios:widget_lib
      - name: Test
        run: >
          bazel test --test_output=errors
          //tests/visor_server_tests
          //tests/visor_client_tests
          //tests/visor_ui_tests
          //tests/visor_ssh_tests
          //tests/message_cache_tests
          //tests/claude_transcript_tests

  # The phone app itself, in the simulator: the probe's cases that need no
  # computer, on the snapshot fixture. The thread must not move when it
  # learns there are rows before it (the jump on the first send after a
  # launch, 0.26). A simulator build needs no signing team.
  xcode26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build (macOS)
        run: >
          bazel build
          //libraries/...
          //tools/staging_server
          //applications/visor_macos:macos_lib
          //applications/visor_menubar:menubar_lib
      - name: Build (iOS)
        run: >
          bazel build --platforms=@apple_support//platforms:ios_sim_arm64
          //libraries/visor_ui
          //applications/visor_ios:ios_lib
          //applications/visor_ios:widget_lib
      - name: Test
        run: >
          bazel test --test_output=errors
          //tests/visor_server_tests
          //tests/visor_client_tests
          //tests/visor_ui_tests
          //tests/visor_ssh_tests
          //tests/message_cache_tests
          //tests/claude_transcript_tests

  # The command-line server on Linux: built, its tests run, and the server
  # itself tried — run, a throwaway session over its WebSocket, restarted,
  # stopped (tools/probes/command_line_server.sh). No agent CLI needed.
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: apt-get update && apt-get install -y --no-install-recommends procps curl netcat-openbsd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: swift build --product visor-server
      # The client's host services on their own: a file that uses
      # Foundation without importing it fails here, as in Visor on Isomer
      # (Package.swift's clientServices).
      - name: Build the client's services
        run: swift build --target VisorServices
      - name: Test
        run: swift test
      - name: Try the server
        run: tools/probes/command_line_server.sh

  # The command-line server on Windows: built, and tried — run, a throwaway
  # session over its WebSocket, stopped through its REST side.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.4.0-release
          tag: 6.4.0-RELEASE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: swift build --product visor-server
      - name: Try the server
        shell: pwsh
        run: |
          $server = ".build\debug\visor-server.exe"
          $password = & $server password
          Start-Process -FilePath $server -ArgumentList "run","--port","7633" -NoNewWindow `
            -RedirectStandardOutput server.log -RedirectStandardError server-errors.log
          Start-Sleep 3
          $env:VISOR_PORT = "7633"; $env:VISOR_TOKEN = $password; $env:QUIT = "1"
          node tools/probes/server.mjs
          $status = $LASTEXITCODE
          Get-Content server.log, server-errors.log
          exit $status

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). Run on main's commits, which releases are of;
  # a pull request may still pin a revision. Reviews holds a release until
  # it passes.
  pins:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/released_pins.sh

  # The version this commit's build takes, and its proof is filed under:
  # MAJOR.MINOR.BUILD, BUILD one past the line's highest on the release
  # server (the plist says MAJOR.MINOR.0), kept there as the commit's.
  number:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: next
        run: echo "version=$($PIPELINE_CI number Visor applications/visor_ios/Info.plist)" >> "$GITHUB_OUTPUT"
        env:
          # The commit itself (a pull request's head, not its merge ref).
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The commit's packages (the iPhone's .ipa, the Mac's apps signed and
  # notarized) at that number, published to Releases as the pull request's
  # builds, or the version's on a pre-release branch (release-*) or main.
  # What is done with them is the runner's ($PIPELINE_CI). (On main the pull
  # request's values are empty, and it takes the push's own.)
  build:
    needs: number
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: $PIPELINE_CI prepare
      - run: $PIPELINE_CI stamp ${{ needs.number.outputs.version }} applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_macos/Info.plist applications/visor_menubar/Info.plist
      - run: tools/build_packages.sh
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}

  # Blue Visor (the client on Isomer: docs/isomer.md), its web client: built
  # optimized, its tests run, then checked in headless Chrome: the end-to-end
  # test against the stand-in server on its three roads, the transcript's
  # layout and the composer typed into. Hosted Linux; Bazel's downloads (the
  # Swift toolchain and its wasm SDKs) kept between runs.
  blue-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # rules_swift wants Bazel's C toolchain to be clang (the runner's
      # default is gcc), as isomer's Linux container sets it.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-blue-web-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'third_party/swift_packages/Package.resolved') }}
          restore-keys: bazel-repo-blue-web-
      # What swift.org's Ubuntu 24.04 toolchain builds and links against
      # (its Dockerfile's packages, as in isomer's Linux container): the
      # host tools Bazel builds with it (swift_ffi's generator, the macro
      # plugins) link Foundation's libcurl and libxml2.
      - name: The Swift toolchain's system packages
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          clang lld binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev
          libncurses-dev libsqlite3-dev libstdc++-13-dev libxml2-dev libz3-dev
          pkg-config tzdata zlib1g-dev
      # The repository cache kept between runs.
      - name: Bazel's repository cache
        run: echo "common --repository_cache=$HOME/.cache/bazel-repo" >> ~/.bazelrc
      - name: Build
        run: bazel build -c opt //applications/visor_web:visor_web_site
      - name: Test
        run: bazel test -c opt --test_output=errors //applications/visor_web/...
      # ffmpeg makes the end-to-end test's recordings (its review's videos).
      - name: ffmpeg
        run: sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: End to end
        run: python3 tools/isomer/e2e/run.py --review review
      - name: Transcript layout
        run: node tools/isomer/e2e/transcript_layout_check.js "$(bazel cquery -c opt --output=files //applications/visor_web:visor_web_site)"
      - name: Composer
        run: node tools/isomer/e2e/composer_check.js "$(bazel cquery -c opt --output=files //applications/visor_web:visor_web_site)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # Blue Visor on Android: the APK as it ships (arm64, its Swift and its
  # Kotlin) built on hosted Linux. The emulator flow and the transcript and
  # composer checks stay in the local proof (tools/isomer/ci/local_ci.sh)
  # for now: the runner's emulator is x86_64, and isomer 0.36's
  # kt_swift_library builds the Swift library for aarch64 whatever ABI the
  # APK is for. They come here, on an x86_64 build, with isomer 0.38, whose
  # library follows the APK's ABI.
  blue-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # rules_swift wants Bazel's C toolchain to be clang (the runner's
      # default is gcc), as isomer's Linux container sets it.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-blue-android-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'third_party/swift_packages/Package.resolved') }}
          restore-keys: bazel-repo-blue-android-
      # What swift.org's Ubuntu 24.04 toolchain builds and links against
      # (its Dockerfile's packages, as in isomer's Linux container): the
      # host tools Bazel builds with it (swift_ffi's generator, the macro
      # plugins) link Foundation's libcurl and libxml2.
      - name: The Swift toolchain's system packages
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          clang lld binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev
          libncurses-dev libsqlite3-dev libstdc++-13-dev libxml2-dev libz3-dev
          pkg-config tzdata zlib1g-dev
      # The repository cache kept between runs.
      - name: Bazel's repository cache
        run: echo "common --repository_cache=$HOME/.cache/bazel-repo" >> ~/.bazelrc
      - name: Build
        run: bazel build -c opt //applications/visor_android:visor_android_apk

  # Blue Visor on the iPhone: the WasmKit app and the one compiled against
  # Isomer's frameworks, for the simulator (no signing team needed), then
  # its fixture's screens in each orientation and the web client's in
  # Mobile Safari, against tests/snapshots. On the release Mac: GitHub's
  # hosted Mac minutes are billed. The harness makes its simulators and
  # removes them after.
  blue-ios:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build
        run: >
          bazel build -c opt --ios_multi_cpus=sim_arm64
          //applications/visor_isomer_ios
          //applications/visor_isomer_compiled_ios
      # Mobile Safari's simulator is this job's own, made new for the run and
      # deleted after it (the iPhone fixture's runner makes and deletes its
      # own), so it never meets the proof's or the releases runner's.
      - name: A fresh simulator for Mobile Safari
        run: |
          xcrun simctl list -j devices | python3 -c 'import json, sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"] == "blue-ci-web-mobile"]' |
            while read -r udid; do xcrun simctl shutdown "$udid" 2>/dev/null || true; xcrun simctl delete "$udid"; done
      - name: Snapshots
        run: python3 tools/isomer/snapshots/snapshots.py run --targets ios,ios-landscape,web-mobile
        env:
          VISOR_SNAPSHOT_RUN_DIR: ${{ runner.temp }}/blue-snapshots
          VISOR_SNAPSHOT_SIMULATOR: blue-ci-web-mobile
      - name: Delete Mobile Safari's simulator
        if: always()
        run: |
          xcrun simctl list -j devices | python3 -c 'import json, sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"] == "blue-ci-web-mobile"]' |
            while read -r udid; do xcrun simctl shutdown "$udid" 2>/dev/null || true; xcrun simctl delete "$udid"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-ios-snapshots
          path: ${{ runner.temp }}/blue-snapshots
          if-no-files-found: ignore
