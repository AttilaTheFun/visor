name: CI
# Pull requests get the fast checks, all at once, each on a machine leased
# from OS Server by the repository's own runners: every app built on Linux
# (the container job), the tests with nothing of Apple's in them on Linux,
# the tests that need a Mac built there and run on GitHub's own Macs (free
# for a public repository), and blue's web client built in a
# Linux container. A diff of documentation alone (docs/, .notes/,
# Markdown) skips them, and a skipped job passes. Until the Mac Studio
# (Logan, 5 Nov 2026: "scope visor down to just ios, macos and android",
# the other platforms kept building where that stays in a container, not
# run), the web client is only built, and the command-line server on
# Windows (a Windows VM) and blue's iPhone snapshots (iOS leases) are off:
# their jobs stay, skipped, and their scripts run by hand. To bring one
# back, drop its `if: false`. Each commit merged to main gets them too,
# then its builds (Logan, 2026-11-02: AdHoc by hand before a merge, an Alpha for each
# commit after it, Production at a release, nothing else): the iPhone and
# iPad app built on Linux and published to Applications Server, which signs
# it (alpha; adhoc by hand on a pull request's branch; their OIDC token says
# which: tools/ci/publish_from_ci.sh). A release is no build of its own:
# Applications Server promotes a commit's Alpha, as tested, to Production
# (the plist's BuildVariant restamped, signed again), when the owner
# releases it in Reviews (the release job). Then the Mac's disk images, their
# number and the agent image on the release Mac (self-hosted, release-mac,
# until the Mac moves to Visor.app), and blue's iPhone snapshots (off for
# now, above). The proof, which is how an agent proposes a release, is a
# workflow of its own (proof.yml), run by hand on GitHub's own runners. A
# newer push to a pull request cancels its run if it hasn't finished. main requires every
# job green (or skipped) on a pull request's head before it merges. A
# fork's pull request never runs on a self-hosted runner. Every job but the
# release Mac's (number, build, agent-image) runs on OS Server's single-use
# runners: each a fresh Linux container with `oss` on its PATH, leasing what
# it needs a Mac for. Its label is its size: visor-jit (12 GB) for a build,
# visor-jit-small (2 GB) for the jobs that only run git or a script. A
# runner serves its own label alone, so no job lands in the wrong size. Three
# of those, changes, rules and pins, run on GitHub's own ubuntu-latest while the
# repository is public, which leaves OS Server's runners to the builds
# (Logan, 6 Nov 2026); on OS Server's small one if it goes private, or
# when the repository variable HOSTED_RUNNERS is `off` (GitHub's runners
# down or backed up). release stays on OS Server's: it reaches Applications
# Server on the LAN.
on:
  pull_request:
  push:
    branches: [main]
  # The owner's Release in Reviews publishes the draft, which makes its v*
  # tag on the commit reviewed: its Alphas promoted to Production (release).
  release:
    types: [published]
  # By hand, on a pull request's branch: its AdHoc build (adhoc).
  workflow_dispatch:
concurrency:
  # A pull request's newer push replaces its older run. Every other run (a
  # commit on main, a build by hand) is a group of its own: GitHub keeps one
  # pending run per group and cancels the rest, so main's runs sharing one
  # left a commit queued between two others with no build.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  # main's runs are never cut short: their builds are a release's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  actions: read
# Whom the jobs' OS Server leases are for (OS Server's API 12): with the
# runner's `ci` key (~/.config/oss/key), each lease is `<job>-<run>@ci`.
env:
  OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
jobs:
  # Whether the pull request changes anything but documentation; a push to
  # main always does.
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event.repository.private || vars.HOSTED_RUNNERS == 'off') && fromJSON('["self-hosted", "visor-jit-small"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The rules of AGENTS.md that must hold, checked (tools/check_rules.py):
  # no signing material, every Swift target strict, no unchecked
  # concurrency, no Combine, no networking in the client's libraries, no
  # platform checks in the server's; on a pull request, its commits without
  # attribution lines. On GitHub's own runners, as changes.
  rules:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event.repository.private || vars.HOSTED_RUNNERS == 'off') && fromJSON('["self-hosted", "visor-jit-small"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_rules.py ${BASE:+--commits "$BASE..HEAD"}

  # The tests that need a Mac (the server's Apple side, the client, its
  # views, SSH): their .xctest bundles built on Linux in this job's own
  # container (tools/ci/mac_tests_build.sh: OS Server's SDK archive and
  # cache), then run on one of GitHub's own Macs (test).
  build-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: tools/ci/mac_tests_build.sh "$RUNNER_TEMP/mac-tests.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-tests
          path: ${{ runner.temp }}/mac-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The bundles run on an xcode-27 runner (tools/ci/mac_tests_run.sh: `xcrun
  # xctest`, Xcode 27.2), which a public repository has for free, leaving OS
  # Server's Mac slots to the agents (Logan, 5 Nov 2026). Named `test` still:
  # main's branch protection requires a check of that name, which a pull
  # request of documentation alone reports as skipped.
  test:
    needs: build-tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-tests
          path: ${{ runner.temp }}
      - run: tools/ci/mac_tests_run.sh "$RUNNER_TEMP/mac-tests.tar.gz" --logs "$RUNNER_TEMP/test-logs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs

  # The command-line server on Linux: built, its tests run, and the server
  # itself tried — run, a throwaway session over its WebSocket, restarted,
  # stopped (tools/probes/command_line_server.sh). No agent CLI needed.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # In a container of Visor's agent image leased from OS Server
      # (tools/ci/linux_tests.sh), which it releases however it ends.
      - run: exec tools/ci/linux_tests.sh

  # The command-line server on Windows: built, and tried — run, a throwaway
  # session over its WebSocket, stopped through its REST side — in a Windows
  # VM leased from OS Server (tools/ci/windows_vm_tests.sh). Off until the
  # Mac Studio (the header): a 16 GB VM, and it builds only on Windows, so
  # no container keeps it building. Skipped, it still reports, as main's
  # required check. To bring it back: `if: needs.changes.outputs.code == 'true'`.
  windows:
    needs: changes
    if: false
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/windows_vm_tests.sh

  # Ready to release: every dependency pinned to a released version
  # (tools/released_pins.sh). Run on main's commits, which releases are of;
  # a pull request may still pin a revision. Reviews holds a release until
  # it passes.
  pins:
    if: github.event_name == 'push'
    runs-on: ${{ (github.event.repository.private || vars.HOSTED_RUNNERS == 'off') && fromJSON('["self-hosted", "visor-jit-small"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/released_pins.sh

  # The version the Mac's disk images and the agent image of this commit of
  # main take: MAJOR.MINOR.BUILD, BUILD one past the line's highest on the
  # release server (the plist says MAJOR.MINOR.0), kept there as the
  # commit's. The iPhone's comes from Applications Server
  # (tools/ci/next_version.sh, in alpha and adhoc).
  number:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: next
        run: echo "version=$($PIPELINE_CI number Visor applications/visor_ios/Info.plist)" >> "$GITHUB_OUTPUT"
        env:
          # The commit itself (a pull request's head, not its merge ref).
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The Mac's disk images of this commit of main (Visor and Visor Server,
  # signed and notarized) at that number, published by the release Mac's
  # runner ($PIPELINE_CI), until the Mac moves to Visor.app and to
  # Applications Server as the iPhone has (alpha). Named `build` still:
  # main's branch protection requires a check of that name, which a pull
  # request's run reports as skipped.
  build:
    needs: [number, linux-programs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: $PIPELINE_CI prepare
      - run: $PIPELINE_CI stamp ${{ needs.number.outputs.version }} applications/visor_macos/Info.plist applications/visor_menubar/Info.plist applications/visor_container_host/Info.plist
      # Visor's own Linux programs, which Visor Server carries
      # (tools/release_mac.sh), from the linux-programs job.
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - run: tools/build_packages.sh
        env:
          VISOR_LINUX_PROGRAMS: ${{ runner.temp }}/linux-programs/linux-programs.tar
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ github.event.pull_request.head.sha }}
          PIPELINE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.pull_request.number }}

  # Visor's own Linux programs (tools/linux_programs.sh: visor-server, also
  # the agents' host, linked fully static), which the build job seals into
  # Visor Server, and alpha and adhoc into Visor.app, for the containers
  # they make: built in a container of Visor's agent image leased from the
  # OS Server on the runner's Mac (tools/ci/linux_programs.sh), as the
  # release Mac has none, and handed over as a tar. Not waiting on number:
  # it needs no version. For main's commits and adhoc's runs by hand.
  linux-programs:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-'))
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: exec tools/ci/linux_programs.sh "$RUNNER_TEMP/linux-programs.tar"
      - run: tar -tvf "$RUNNER_TEMP/linux-programs.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs.tar
          retention-days: 7

  # Visor's images (tools/containers/visor-agent/Dockerfile), built on the
  # release Mac (Apple's container) and pushed to GitHub's registry as this
  # build's version, its MAJOR.MINOR and latest: its runtime target as
  # ghcr.io/attilathefun/visor, which a Visor server of that version makes
  # sessions' containers from, and its build target, with the toolchains, as
  # ghcr.io/attilathefun/visor-agent, CI's containers' and the co-tenant's.
  agent-image:
    needs: number
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: tools/containers/publish_agent_image.sh ${{ needs.number.outputs.version }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}

  # The apps built on Linux where a session's agent builds them: in a
  # container of Visor's agent image, the job's own (visor-jit), the Apple apps with
  # rules_applecross from that server's files, the Linux client, blue
  # Visor's Android APK, and the Mac's libraries and servers
  # (tools/ci/container_build.sh).
  # A fork's pull request never runs there.
  container:
    needs: [changes, number, agent-image]
    # On a pull request number and agent-image are skipped, and it runs all the same.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    # In a container of its own (visor-jit), side by side with the other
    # jobs, its Bazel reading OS Server's cache (tools/ci/container_build.sh
    # builds where it runs): no runner's Mac between jobs, no kept volume.
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # The agent image a build on a Mac would use (main's commit's own, a
      # pull request its line's): named, unused in the job's own container.
      - id: image
        env:
          VERSION: ${{ needs.number.outputs.version }}
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          echo "tag=${VERSION:-${line%.*}}" >> "$GITHUB_OUTPUT"
      - run: exec tools/ci/container_build.sh ghcr.io/attilathefun/visor-agent:${{ steps.image.outputs.tag }}

  # Blue Visor (the client on Isomer: docs/isomer.md), its web client: built
  # optimized (tools/ci/container_blue_web.sh --build-only). Until the Mac
  # Studio (the header) nothing runs it: without --build-only the script
  # goes on to its tests, then the end-to-end test against the stand-in
  # server on its three roads, the transcript's layout and the composer
  # typed into, in headless Chromium. Its Android APK is built in the
  # container job.
  blue-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # In a container of its own (visor-jit), side by side with the other
    # jobs (tools/ci/container_blue_web.sh runs where it runs).
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: image
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          echo "tag=${line%.*}" >> "$GITHUB_OUTPUT"
      - run: exec tools/ci/container_blue_web.sh ghcr.io/attilathefun/visor-agent:${{ steps.image.outputs.tag }} review --build-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-web-review
          path: review
          if-no-files-found: ignore

  # Blue Visor's web client on the iPhone, on each commit to main (its
  # snapshots are proof-like): the web site built in the job's own container
  # (visor-jit), served on a Mac slot of OS Server's primary, and pictured
  # in an iOS lease's Mobile Safari there (tools/ci/blue_ios_lease.sh),
  # against tests/snapshots. Off until the Mac Studio (the header): an iOS
  # lease and a 12 GB container for each commit, to run the web client.
  blue-ios:
    # When on: main's commits, and by hand: a branch's run tries it before
    # it merges. After agent-image on a push to main, which
    # publishes the line's image it takes: a commit that starts a line
    # (0.44.0) has none before it (agent-image is skipped by hand, and it
    # runs anyway). To bring it back:
    # `if: ${{ !cancelled() && !failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}`
    needs: agent-image
    if: false
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The line's released agent image (MAJOR.MINOR), as a pull request's
      # container job takes.
      # exec: the runner's cancel reaches the script's trap, which releases
      # the leases.
      - name: Built on Linux, pictured on iOS leases
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          exec tools/ci/blue_ios_lease.sh --image "ghcr.io/attilathefun/visor-agent:${line%.*}" --run "$RUNNER_TEMP/blue-ios"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-ios-snapshots
          path: ${{ runner.temp }}/blue-ios
          if-no-files-found: ignore

  # The Alpha of each commit on main (--config=alpha), never a pull
  # request's: its version asked of Applications Server and stamped in
  # (tools/ci/next_version.sh), then the iPhone and iPad app and Visor.app
  # for the Mac built on Linux in the job's own container (visor-jit;
  # tools/ci/container_build.sh, VISOR_CI_PACKAGE), optimized, as a release
  # promotes this very build (the release job). The iPhone's is a device
  # build signed ad hoc with a placeholder profile (--config=ci_device, CI
  # holds none of the team's); Visor.app is given Visor's Linux programs
  # (linux-programs, tools/ci/mac_app_linux_programs.sh). The server signs
  # each again with its bundle id's own identity and profile when it is
  # published (tools/ci/publish_from_ci.sh), and notarizes the Mac's
  # (Logan, 5 Nov 2026: Alpha and Production both through Applications).
  # After the container job: nothing is published from a tree that doesn't
  # build. The job's OIDC token says what it is; no key, profile or
  # password here.
  alpha:
    needs: [container, linux-programs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    permissions:
      contents: read
      # The OIDC token Applications Server checks.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # 0.44.N, the next of the committed line for the token's commit,
      # stamped into the checkout's Info.plists and never committed.
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/next_version.sh Visor applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_mac/Info.plist applications/visor_container_host/Info.plist
      # The line's released agent image (MAJOR.MINOR), as a pull request's
      # container job takes.
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          exec tools/ci/container_build.sh "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --config=alpha --config=ci_device --compilation_mode=opt //applications/visor_ios //applications/visor_mac
      # The server signs it again from the entitlements it carries: built
      # unsigned, it would lose the microphone.
      - name: Visor.app signed with its entitlements
        run: tools/ci/mac_app_signed.sh .ci/packages/visor_mac.zip com.apple.security.device.audio-input com.apple.developer.aps-environment
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - name: Visor's Linux programs into Visor.app
        run: tools/ci/mac_app_linux_programs.sh .ci/packages/visor_mac.zip "$RUNNER_TEMP/linux-programs/linux-programs.tar"
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          SUMMARY: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$SUMMARY" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.ipa .ci/packages/visor_mac.zip

  # AdHoc: a pull request's branch built by hand (workflow_dispatch on a
  # branch that is neither main nor a release branch), the iPhone and iPad
  # app and Visor.app built as alpha's are with --config=adhoc and
  # published; the server takes them as AdHoc builds, kept a week
  # (AttilaTheFun/applications' docs/VARIANTS.md). Not after the container
  # job, which a run by hand skips: the build itself stops a tree that
  # doesn't build.
  adhoc:
    needs: linux-programs
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-')
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/next_version.sh Visor applications/visor_ios/Info.plist applications/visor_ios/Widget/Info.plist applications/visor_mac/Info.plist applications/visor_container_host/Info.plist
      - name: Build
        env:
          VISOR_CI_PACKAGE: .ci/packages
        run: |
          line="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' applications/visor_ios/Info.plist)"
          exec tools/ci/container_build.sh "ghcr.io/attilathefun/visor-agent:${line%.*}" \
            --config=adhoc --config=ci_device --compilation_mode=opt //applications/visor_ios //applications/visor_mac
      # The server signs it again from the entitlements it carries: built
      # unsigned, it would lose the microphone.
      - name: Visor.app signed with its entitlements
        run: tools/ci/mac_app_signed.sh .ci/packages/visor_mac.zip com.apple.security.device.audio-input com.apple.developer.aps-environment
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: ${{ runner.temp }}/linux-programs
      - name: Visor's Linux programs into Visor.app
        run: tools/ci/mac_app_linux_programs.sh .ci/packages/visor_mac.zip "$RUNNER_TEMP/linux-programs/linux-programs.tar"
      # The branch's commit's message, from git: a run by hand has no
      # head_commit in its event.
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.ipa .ci/packages/visor_mac.zip

  # Production, at a release. Nothing is built: Applications Server
  # promotes the Alphas main's CI published of the release's commit
  # (alpha), the builds Logan tested, stamping them Production and signing
  # them again (tools/ci/promote_from_ci.sh, AttilaTheFun/applications'
  # docs/CI.md, "Production by promotion"; Logan, 2026-11-02: "the alpha
  # builds and production builds should be identical today modulo the
  # plist key"). The token's v* tag, released by a releaser, is the
  # permission. An Alpha that isn't its app's newest is kept a week, so a
  # release is made within a week of its commit (or while it is still the
  # newest). The Mac's disk images are the build job's, as before.
  release:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 90
    permissions:
      contents: read
      # The OIDC token Applications Server checks.
      id-token: write
    steps:
      # The release's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A release is a main commit: a tag on any other stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          BODY: ${{ github.event.release.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
      - name: Promote
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/promote_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md"
