name: Site
# The site (site/) on GitHub Pages, from main: a static page, put up as it
# is. Its pictures come from the Screenshots workflow's artifacts.
#
# Blue Visor's web client goes up beside it, at app/: the
# visor-isomer-site.tar.gz a release carries (tools/isomer/package_site.sh,
# built on the release's commit and attached to its draft), from the
# release being published, the tag given by hand, or else the latest
# release. Compiled output never goes into git.
#   gh workflow run pages.yml [-f tag=<tag>]
# A release's run is on its tag, so the github-pages environment must let
# tags deploy (Settings > Environments > github-pages: a tag rule `v*`).
# Pages names a deployment by its commit: a release on a commit a push to
# main has already deployed (one that changed site/ or this file) reports
# success and changes nothing. Then deploy from a later commit on main:
#   gh workflow run pages.yml --ref main
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose visor-isomer-site.tar.gz goes up at app/ (empty for the latest release)
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # On the repository's own runner (a Mac): the release's asset fetched with
  # curl, and the site packed with the Mac's tar into the `github-pages`
  # artifact deploy-pages takes (upload-pages-artifact wants GNU tar there).
  deploy:
    runs-on: [self-hosted, visor-jit]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Blue Visor's web client, from a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
          release="$api/latest"
          [ -z "$TAG" ] || release="$api/tags/$TAG"
          asset="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$release" |
            python3 -c 'import json, sys; print(next((a["url"] for a in json.load(sys.stdin).get("assets", []) if a["name"] == "visor-isomer-site.tar.gz"), ""))' || true)"
          rm -f visor-isomer-site.tar.gz
          if [ -n "$asset" ] && curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o visor-isomer-site.tar.gz "$asset"; then
            mkdir -p site/app
            tar -xzf visor-isomer-site.tar.gz -C site/app
            # AppleDouble files a macOS tar may have added (._*).
            find site/app -name '._*' -delete
            test -f site/app/index.html && test -f site/app/app.wasm
          else
            echo "No visor-isomer-site.tar.gz on ${TAG:-the latest release}: the site goes up without the web client."
          fi
      - uses: actions/configure-pages@v5
      - name: The site, packed
        run: tar -cLf "$RUNNER_TEMP/artifact.tar" -C site --exclude .git --exclude .github .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
