name: Proof
# Visor's proof, which is how an agent proposes a release (Logan, 5 Nov
# 2026: "the proof should include mac, ios and android but it should only
# run when you're proposing a release and then the comparison is version
# over version"): run by hand on main (`gh workflow run proof.yml --ref
# main`), or on a branch at an earlier commit to bisect a regression after
# the fact. The apps are built in Linux containers of the repository's own
# (visor-jit, as CI builds them) and run on GitHub's own runners, which a
# public repository has for free, leaving OS Server's machines to CI and
# the agents (Logan, 5 Nov 2026):
# - the iPhone app's fixture screens in portrait and on its side, and for a
#   full proof its UI cases, on an iPhone 17 simulator
#   (tools/ci/proof_ios.sh), and Visor.app's fixture screens
#   (tools/ci/proof_mac.sh), each on an `xcode-27` Mac;
# - blue Visor's on an Android emulator under Ubuntu's KVM
#   (tools/ci/proof_android.sh).
# Each screen is compared with the same one in the previous release's proof
# (tools/ci/proof_compare.sh: the newest v* tag before the commit, else the
# commit before), which that release carries: when the owner publishes a
# release in Reviews, its commit's proof is attached to it (release).
# Reviews reads a proof from its run's `proof` artifact, and no release is
# made without one.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: The proof's kind (full also runs the iPhone's UI cases)
        type: choice
        options: [full, quick]
        default: full
  release:
    types: [published]
permissions:
  contents: read
  actions: read
jobs:
  # The iPhone app and its probe for Apple silicon's simulator, and
  # Visor.app (signed ad hoc, as a build on Linux is), in the job's own
  # container (tools/ci/container_build.sh, which then takes no image).
  build-apple:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 45
    env:
      OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh "$GITHUB_JOB" \
            --macos_cpus=arm64 --ios_multi_cpus=sim_arm64 \
            //applications/visor_ios //tests/ios_probe:visor_probe //applications/visor_mac
      - uses: actions/upload-artifact@v4
        with:
          name: apps-ios
          path: |
            .ci/proof-apps/visor_ios.ipa
            .ci/proof-apps/visor_probe.zip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: apps-mac
          path: .ci/proof-apps/visor_mac.zip
          if-no-files-found: error
          retention-days: 1

  # Blue Visor's APK for x86_64, which GitHub's emulator is.
  build-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 45
    env:
      OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh "$GITHUB_JOB" \
            --compilation_mode=opt --android_platforms=@rules_android//:x86_64 \
            //applications/visor_android:visor_android_apk
      - uses: actions/upload-artifact@v4
        with:
          name: apps-android
          path: .ci/proof-apps/*.apk
          if-no-files-found: error
          retention-days: 1

  ios:
    needs: build-apple
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apps-ios
          path: ${{ runner.temp }}/apps
      - run: tools/ci/proof_ios.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part" "$KIND"
        env:
          KIND: ${{ inputs.kind || 'full' }}
      # The part whether its screens came up or not: a broken screen is what
      # the proof is for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-ios
          path: ${{ runner.temp }}/part
          retention-days: 7

  mac:
    needs: build-apple
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apps-mac
          path: ${{ runner.temp }}/apps
      - run: tools/ci/proof_mac.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-mac
          path: ${{ runner.temp }}/part
          retention-days: 7

  android:
    needs: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apps-android
          path: ${{ runner.temp }}/apps
      - run: tools/ci/proof_android.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/part"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-android
          path: ${{ runner.temp }}/part
          retention-days: 7

  # The proof from what the platforms pictured, whichever of them came up,
  # compared with the base's (CoreGraphics' diff, so on a Mac). It fails
  # when a platform's part did, after the proof is kept.
  proof:
    needs: [build-apple, build-android, ios, mac, android]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The history and the tags: the previous release is what the
          # screens are compared with.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
      - run: tools/ci/proof_compare.sh "$RUNNER_TEMP/parts" "$RUNNER_TEMP/proof" "$KIND"
        env:
          KIND: ${{ inputs.kind || 'full' }}
          # The previous release's own proof, from its release or its run.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90
      - if: needs.ios.result != 'success' || needs.mac.result != 'success' || needs.android.result != 'success'
        run: |
          echo "::error::A platform's part failed: iPhone $IOS, Mac $MAC, Android $ANDROID"
          exit 1
        env:
          IOS: ${{ needs.ios.result }}
          MAC: ${{ needs.mac.result }}
          ANDROID: ${{ needs.android.result }}

  # The release's own proof attached to it once the owner publishes it
  # (tools/ci/release_proof.sh), for the next release to be compared with.
  release:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - run: tools/ci/release_proof.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
