name: Proof
# SCRATCH (branch inspector-crash, never merged): the Mac's screens twice,
# to find what moves between runs (visor#244).
on:
  push:
    branches: [inspector-crash]
permissions:
  contents: read
  actions: read
jobs:
  build-apple:
    runs-on: [self-hosted, visor-jit]
    timeout-minutes: 45
    env:
      OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          VISOR_CI_PACKAGE=.ci/proof-apps tools/ci/container_build.sh "$GITHUB_JOB" \
            --macos_cpus=arm64 //applications/visor_mac
      - uses: actions/upload-artifact@v4
        with:
          name: apps-mac
          path: .ci/proof-apps/visor_mac.zip
          if-no-files-found: error
          retention-days: 1
  mac:
    needs: build-apple
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apps-mac
          path: ${{ runner.temp }}/apps
      - run: tools/ci/mac_twice.sh "$RUNNER_TEMP/apps" "$RUNNER_TEMP/twice"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: twice
          path: ${{ runner.temp }}/twice
          retention-days: 3
