name: Screenshots
# The site's pictures (site/): the Mac client and the phone app on the
# screenshot fixture, in the dark look, kept as this run's artifact to be
# copied into site/images. Run by hand (the release Mac's runner starts it
# for a version's dossier), or when the Mac's screenshot tool or how it is
# run changes. In a macOS VM leased from OS Server, on the repository's own
# runner (tools/ci/mac_vm_screenshots.sh).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/mac_screenshots/**'
      - 'tools/ci/mac_vm_screenshots.sh'
      - '.github/workflows/screenshots.yml'
# A pull request's newer commit takes over from the one before: only the
# branch's head is pictured. A run by hand is never cut short.
concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pictures:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, visor-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_screenshots.sh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: shots/mac-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: shots/site-*.png
          if-no-files-found: ignore
