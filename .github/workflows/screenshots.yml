name: Screenshots
# The site's pictures (site/): the Mac client and the phone app on the
# screenshot fixture, in the dark look, kept as this run's artifact to be
# copied into site/images. Run by hand only (the release Mac's runner starts
# it for a version's dossier): it leases a VM, which a pull request's CI
# never does (docs/CI_POLICY.md in AttilaTheFun/reviews), so a change to the
# Mac's screenshot tool is tried by running this on its branch. In a macOS
# VM leased from Shireworks, from a runner Shireworks makes for the job
# (visor-jit-small, a Linux container that only leases): everything Mac,
# the build too, happens in the VM (tools/ci/mac_vm_screenshots.sh).
on:
  workflow_dispatch:
jobs:
  pictures:
    runs-on: [self-hosted, visor-jit-small]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_screenshots.sh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: shots/mac-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: shots/site-*.png
          if-no-files-found: ignore
