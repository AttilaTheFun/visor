name: Screenshots
# The site's pictures (site/): the Mac client and the phone app on the
# screenshot fixture, in the dark look, kept as this run's artifact to be
# copied into site/images. Run by hand only (the release Mac's runner starts
# it for a version's dossier), never on a push or a pull request, so a
# change to the Mac's screenshot tool is tried by running this on its
# branch. On one of GitHub's own Macs (`xcode-27`, a desktop session that
# may picture its screen), everything Mac there, the build too
# (tools/ci/hosted_screenshots.sh), in place of the macOS VM Shireworks
# leased for it (Logan, 15 Nov 2026: a public repository's CI on GitHub's
# runners alone).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pictures:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
      - run: tools/ci/hosted_screenshots.sh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: shots/mac-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: shots/site-*.png
          if-no-files-found: ignore
