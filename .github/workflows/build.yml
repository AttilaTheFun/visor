name: Build
# A branch's commit built to try before it merges, on the release Mac's
# runner (self-hosted, release-mac): a push whose head commit says
# :build:, a pull request's conversation saying :build: (by its owner or a
# collaborator), or by hand. Never a fork's: only this repository's
# branches are built here. What is done with the packages is the runner's
# ($PIPELINE_CI).
on:
  push:
    branches-ignore: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: build-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message, ':build:'))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, ':build:')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: [self-hosted, release-mac]
    timeout-minutes: 90
    steps:
      # Said in a pull request's conversation: its own branch and commit,
      # unless it comes from a fork.
      - name: The pull request
        id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.repo.full_name)"
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "#$NUMBER is from $repo: a fork's is not built here"; exit 1; }
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha)" >> "$GITHUB_OUTPUT"
          echo "ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha || github.sha }}
      - run: $PIPELINE_CI prepare
      - run: tools/build_packages.sh
      - run: $PIPELINE_CI publish Visor dist/packages/*
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SHA: ${{ steps.pr.outputs.sha }}
          PIPELINE_BRANCH: ${{ steps.pr.outputs.ref }}
          PIPELINE_PULL_REQUEST: ${{ github.event.issue.number }}
