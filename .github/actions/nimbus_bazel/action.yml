# Bazel's settings for a job on a Nimbus runner (`[self-hosted, visor-ci]`:
# a single-use Linux container, Nimbus' ci-github controller), as the
# checkout's .bazelrc.user (which .bazelrc try-imports), so every Bazel the
# job runs reads them, its scripts' alike:
# - Nimbus' bazelrc (`nimbus job bazel-config`, the runner's own
#   /opt/nimbus/bin/nimbus): its downloader config, which sends
#   MODULE.bazel's placeholders (apple-sdks.invalid: Xcode 27.2's SDK
#   archive; ported-tools.invalid: rules_applecross's clean-room tools, by
#   their SHA-256) to Nimbus' files, never on GitHub's runners as Apple's
#   SDKs may not be redistributed; `--config=apple_on_linux`; and a small
#   runner's flags;
# - no bazel-* convenience links in the checkout, and the downloads retried,
#   as tools/ci/ci_bazel.sh has them on GitHub's runners.
# Nimbus' Bazel cache is read through the runner's ~/.bazelrc, which Nimbus
# writes; with cache-write (populate-apple's alone) it is written too, once
# Nimbus has checked the job's OIDC token (a push to main, the job
# `ci.populate` names): the job needs `id-token: write`. Nothing of
# BuildBuddy's or GitHub's cache.
name: Nimbus' Bazel settings
description: Writes Bazel's settings for a job on a Nimbus runner
inputs:
  cache-write:
    description: "true: this job writes Nimbus' Bazel cache (populate-apple's, at a push to main)"
    default: "false"
runs:
  using: composite
  steps:
    - name: Nimbus' Bazel cache, written by this job
      if: inputs.cache-write == 'true'
      shell: bash
      run: /opt/nimbus/bin/nimbus job cache-write
    - name: Bazel's settings
      shell: bash
      run: |
        rc="$(/opt/nimbus/bin/nimbus job bazel-config)"
        printf '%s\n' "# .github/actions/nimbus_bazel's: CI's Bazel settings on a Nimbus runner" \
          "import $(cd "$(dirname "$rc")" && pwd)/$(basename "$rc")" \
          "common --experimental_convenience_symlinks=ignore" \
          "common --experimental_repository_downloader_retries=5" > .bazelrc.user
        sed 's/^/  /' .bazelrc.user "$rc"
