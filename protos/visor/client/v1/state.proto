// A session's ephemeral state: everything about it that is not the record.
// Sessions.Watch sends it whole, then its changes, for as long as the
// client follows the session. Where the turn stands (sending, thinking,
// responding, waiting on something, idle) is part of it; the reply's words
// are not: they come with its row, synced (rows.proto; docs/protocol.md,
// The turn's state).
syntax = "proto3";

package visor.client.v1;

// The session to watch.
message WatchSessionRequest {
  string session = 1;
}

// The state whole: on watching.
message SessionState {
  // Was the replies being written (0.64's design), never sent.
  reserved 1;
  reserved "responding";
  // The turn's status lines so far: tool calls, subagents, shells, thinking.
  repeated StatusItem status = 2;
  // What the agent is doing ("Bash: ls"); empty for nothing.
  string activity = 3;
  // A turn is running.
  bool busy = 4;
  // A tool call waiting for Allow or Deny, or the agent's questions.
  optional Approval approval = 5;
  // What the user said during the turn, waiting for it to end.
  repeated string queued = 6;
  // What the user is told about the session until they acknowledge it.
  string notice = 7;
  // A sign-in waiting for its code (`/login`): the page to sign in at.
  string sign_in = 8;
  // The record's revision when the state was read.
  int64 record_revision = 9;
  // Where the turn stands.
  TurnState turn = 10;
}

// Where a session's turn stands, one state at a time. When several things
// are true, the most pressing: an approval, a question or a sign-in; a
// tool call or a subagent running; the reply being written; thinking; the
// person's message on its way; between turns, work left in the background.
message TurnState {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_SENDING = 1;
    PHASE_THINKING = 2;
    PHASE_RESPONDING = 3;
    PHASE_WAITING = 4;
    PHASE_IDLE = 5;
  }
  Phase phase = 1;
  // For waiting: what it waits on, in the order the agent began them.
  repeated TurnWait waits = 2;
}

// One thing a waiting turn waits on.
message TurnWait {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_APPROVAL = 1;
    KIND_QUESTION = 2;
    KIND_SIGN_IN = 3;
    KIND_TOOL = 4;
    KIND_SUBAGENT = 5;
    KIND_BACKGROUND = 6;
  }
  Kind kind = 1;
  // The tool call's, the approval's or the background task's id.
  string id = 2;
  // What it is, in a line ("Bash: bazel test //tests:linux", a subagent's
  // description, an approval's summary).
  string label = 3;
  // What sort of work, for its symbol; unspecified for an approval, a
  // question or a sign-in.
  StatusItem.Kind work = 4;
}

// One thing the turn is doing or has done.
message StatusItem {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_THINKING = 1;
    KIND_SHELL = 2;
    KIND_MONITOR = 3;
    KIND_SUBAGENT = 4;
    KIND_TOOL = 5;
    KIND_TASKS = 6;
  }
  string id = 1;
  Kind kind = 2;
  string label = 3;
  bool running = 4;
  // For the task list: as last written.
  repeated TaskItem tasks = 5;
}

message TaskItem {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING = 1;
    STATE_ACTIVE = 2;
    STATE_DONE = 3;
  }
  string title = 1;
  State state = 2;
}

// A tool call waiting for the user's Allow or Deny, or what the agent asks
// the user (AskUserQuestion: `questions`, answered rather than allowed).
message Approval {
  string id = 1;
  // The tool ("Bash", "Edit", "AskUserQuestion"…).
  string tool = 2;
  // One line of what it wants to do.
  string summary = 3;
  repeated Question questions = 4;
}

message Question {
  message Option {
    string label = 1;
    string description = 2;
  }
  string question = 1;
  string header = 2;
  repeated Option options = 3;
  bool multi_select = 4;
}

// What changed in a session's state, one thing at a time, in the order
// the server learned it.
message SessionChange {
  oneof change {
    // The state whole, in place of what the client holds.
    SessionState state = 1;
    // The turn's status lines, whole, whenever they change.
    StatusList status = 4;
    // What the agent is doing; empty for nothing.
    string activity = 5;
    // The turn started (true) or ended.
    bool busy = 6;
    // A tool call or a question waiting; unset `approval` once answered.
    ApprovalChange approval = 7;
    // What the user is told until they acknowledge it; empty once they have.
    string notice = 8;
    // Something went wrong: shown under the thread until the next turn.
    string failure = 9;
    // What waits for the turn's end.
    QueuedList queued = 10;
    // Where the turn stands, whenever that changes.
    TurnState turn = 11;
  }
  // Were a reply's words and their settling (0.64's design), never sent.
  reserved 2, 3;
  reserved "append", "settled";
}

message StatusList {
  repeated StatusItem items = 1;
}

message ApprovalChange {
  optional Approval approval = 1;
}

message QueuedList {
  repeated string messages = 1;
}
